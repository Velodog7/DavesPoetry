<title>Multitudes of Dave: Selected Poems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">

<style id="app-styles">
  /* ================= TOKENS ================= */
  :root{
    --bg:#F4F3F0;
    --surface:#FFFFFF;
    --surface-2:#FAFAF8;
    --fill:rgba(20,20,24,.045);
    --fill-2:rgba(20,20,24,.075);
    --ink:#16161A;
    --ink-2:#6A6A73;
    --ink-3:#9B9BA3;
    --accent:#3B6FD4;
    --accent-2:#2E58AC;
    --accent-wash:#E7EEFB;
    --like:#E5484D;
    --like-wash:#FCE9EA;
    --hairline:rgba(20,20,24,.09);
    --border:rgba(20,20,24,.10);
    --focus:#3B6FD4;
    --shadow-1:0 1px 2px rgba(18,20,28,.05);
    --shadow-2:0 2px 5px rgba(18,20,28,.05), 0 12px 28px -14px rgba(18,20,28,.16);
    --shadow-3:0 6px 14px rgba(18,20,28,.08), 0 26px 48px -20px rgba(18,20,28,.28);
    --glass:rgba(244,243,240,.78);

    --f-ui:"Figtree", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    --f-serif:"Shippori Mincho", "Hiragino Mincho ProN", "Iowan Old Style", Georgia, serif;
    --f-display:var(--f-serif);
    --f-verse:var(--f-serif);

    --step:1;
    --fs-micro:calc(0.7rem * var(--step));
    --fs-cap:calc(0.81rem * var(--step));
    --fs-ui:calc(0.94rem * var(--step));
    --fs-read:calc(1.06rem * var(--step));
    --fs-verse:calc(1.2rem * var(--step));
    --fs-h3:calc(1.34rem * var(--step));
    --fs-h2:calc(1.95rem * var(--step));
    --fs-h1:calc(2.9rem * var(--step));

    --r-xs:8px;
    --r-sm:12px;
    --r-md:16px;
    --r-lg:22px;
    --r-xl:28px;
    --r-pill:999px;

    /* iOS-flavoured motion: firm ease-out for movement, spring for feedback */
    --ease:cubic-bezier(.32,.72,0,1);
    --spring:cubic-bezier(.34,1.4,.64,1);
    --dur-s:180ms;
    --dur-m:380ms;
    --gutter:clamp(18px, 4.5vw, 56px);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F0F12;
      --surface:#1A1A1E;
      --surface-2:#222227;
      --fill:rgba(255,255,255,.06);
      --fill-2:rgba(255,255,255,.10);
      --ink:#F2F2EF;
      --ink-2:#A2A2AA;
      --ink-3:#6E6E77;
      --accent:#7FA8F5;
      --accent-2:#9CBCFA;
      --accent-wash:#1A2740;
      --like:#FF6B70;
      --like-wash:#361A1C;
      --hairline:rgba(255,255,255,.11);
      --border:rgba(255,255,255,.13);
      --focus:#7FA8F5;
      --shadow-1:0 1px 2px rgba(0,0,0,.4);
      --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.7);
      --shadow-3:0 8px 18px rgba(0,0,0,.5), 0 30px 56px -22px rgba(0,0,0,.8);
      --glass:rgba(15,15,18,.76);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F0F12;
    --surface:#1A1A1E;
    --surface-2:#222227;
    --fill:rgba(255,255,255,.06);
    --fill-2:rgba(255,255,255,.10);
    --ink:#F2F2EF;
    --ink-2:#A2A2AA;
    --ink-3:#6E6E77;
    --accent:#7FA8F5;
    --accent-2:#9CBCFA;
    --accent-wash:#1A2740;
    --like:#FF6B70;
    --like-wash:#361A1C;
    --hairline:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.13);
    --focus:#7FA8F5;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 6px rgba(0,0,0,.4), 0 14px 30px -16px rgba(0,0,0,.7);
    --shadow-3:0 8px 18px rgba(0,0,0,.5), 0 30px 56px -22px rgba(0,0,0,.8);
    --glass:rgba(15,15,18,.76);
  }

  :root[data-contrast="high"]{ --ink-2:var(--ink); --ink-3:var(--ink); --hairline:var(--ink); --border:var(--ink); }
  :root[data-contrast="high"]:not([data-theme="dark"]){ --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --accent:#123A8A; --accent-wash:#DCE6FA; --like:#A81219; }
  :root[data-theme="dark"][data-contrast="high"]{ --bg:#000000; --surface:#000000; --ink:#FFFFFF; --accent:#A9C6FF; --accent-wash:#12203A; --like:#FF9A9E; }

  /* ================= RESET ================= */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--f-ui); font-size:var(--fs-ui); font-weight:400; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background var(--dur-m) var(--ease), color var(--dur-m) var(--ease);
  }
  h1,h2,h3,h4,p,ul,figure{ margin:0; }
  ul{ list-style:none; padding:0; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  input,textarea,select{ font-family:inherit; font-size:inherit; color:inherit; }
  img,svg{ display:block; max-width:100%; }
  :focus-visible{ outline:3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset:2px; border-radius:var(--r-sm); }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }
  [data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ================= SHARED ================= */
  .label{
    font-family:var(--f-ui); font-size:var(--fs-micro); font-weight:600;
    letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3);
  }
  .label-ai{ color:var(--accent); }
  .num-tab{ font-variant-numeric:tabular-nums; }

  .card{
    background:var(--surface); border-radius:var(--r-lg); box-shadow:var(--shadow-1);
    border:1px solid var(--hairline);
  }

  /* ================= SHELL ================= */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .masthead{
    position:sticky; top:0; z-index:40; background:var(--glass);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--hairline);
  }
  .masthead-inner{
    max-width:1180px; margin:0 auto; padding:11px var(--gutter);
    display:flex; align-items:center; gap:20px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .seal{
    width:30px; height:30px; border-radius:9px; flex-shrink:0; display:grid; place-items:center;
    background:linear-gradient(160deg, var(--accent), var(--accent-2));
    color:#fff; font-family:var(--f-display); font-size:15px; font-weight:600; line-height:1;
    box-shadow:0 2px 6px -1px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  /* The author can name this site anything. Truncate rather than let a long
     name push the navigation off the edge of a phone. */
  .brand-mark{
    font-family:var(--f-display); font-weight:600; font-size:1.08rem; letter-spacing:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
  }
  .brand-byline{ font-size:var(--fs-micro); font-weight:500; color:var(--ink-3); white-space:nowrap; letter-spacing:.02em; }

  .navbtns{ display:flex; gap:8px; margin-left:8px; }
  .navbtn{
    padding:9px 18px; border-radius:var(--r-pill); font-size:var(--fs-cap); font-weight:600;
    color:var(--ink-2); white-space:nowrap; border:1px solid transparent;
    transition:color var(--dur-s) var(--ease), background var(--dur-s) var(--ease),
      border-color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .navbtn:hover{ color:var(--ink); background:var(--fill); }
  .navbtn:active{ transform:scale(.95); }
  .navbtn[aria-current="page"]{ background:var(--accent-wash); color:var(--accent); border-color:transparent; }

  .masthead-tools{ margin-left:auto; display:flex; align-items:center; gap:4px; }
  .icon-btn{
    width:36px; height:36px; display:grid; place-items:center; color:var(--ink-2);
    border-radius:var(--r-pill);
    transition:color var(--dur-s) var(--ease), background var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .icon-btn:hover{ color:var(--ink); background:var(--fill); }
  .icon-btn:active{ transform:scale(.9); }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.is-on{ color:#fff; background:var(--accent); }

  main{ flex:1; max-width:1180px; margin:0 auto; padding:0 var(--gutter) 90px; width:100%; }
  .view{ animation:view-in var(--dur-m) var(--ease); }
  @keyframes view-in{ from{ opacity:0; transform:translateY(10px) scale(.995);} to{ opacity:1; transform:none;} }

  footer.sitefoot{
    border-top:1px solid var(--hairline); padding:24px var(--gutter) 40px;
    display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
    max-width:1180px; margin:0 auto; width:100%;
  }
  footer.sitefoot p{ font-size:var(--fs-cap); color:var(--ink-3); }

  /* ================= BUTTONS & CONTROLS ================= */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    padding:11px 20px; border-radius:var(--r-pill); font-size:var(--fs-cap); font-weight:600;
    letter-spacing:.005em; white-space:nowrap; border:1px solid transparent;
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease),
      border-color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring), box-shadow var(--dur-s) var(--ease);
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--accent); color:#fff; box-shadow:0 2px 8px -2px color-mix(in srgb, var(--accent) 55%, transparent); }
  .btn-primary:hover{ background:var(--accent-2); }
  .btn-outline{ background:var(--surface); border-color:var(--border); color:var(--ink); box-shadow:var(--shadow-1); }
  .btn-outline:hover{ background:var(--surface-2); border-color:var(--ink-3); }
  .btn-tinted{ background:var(--accent-wash); color:var(--accent); }
  .btn-tinted:hover{ background:color-mix(in srgb, var(--accent-wash) 70%, var(--accent) 12%); }
  .btn-quiet{ color:var(--ink-2); }
  .btn-quiet:hover{ color:var(--ink); background:var(--fill); }
  .btn-danger{ background:var(--like-wash); color:var(--like); }
  .btn-danger:hover{ background:color-mix(in srgb, var(--like-wash) 65%, var(--like) 16%); }
  .btn-sm{ padding:8px 15px; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }

  /* iOS filled input */
  .field{ display:flex; flex-direction:column; gap:7px; margin-bottom:18px; }
  .field label{ font-size:var(--fs-cap); font-weight:600; color:var(--ink-2); }
  .input,
  .field input[type="text"],.field input[type="date"],.field input[type="password"],
  .field textarea,.field select{
    background:var(--fill); border:1px solid transparent; border-radius:var(--r-sm);
    padding:12px 14px; color:var(--ink); width:100%;
    transition:background var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease);
  }
  .input::placeholder,.field input::placeholder,.field textarea::placeholder{ color:var(--ink-3); }
  .input:focus,.field input:focus,.field textarea:focus,.field select:focus{
    outline:none; background:var(--surface); border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .field textarea{ font-family:var(--f-verse); font-size:var(--fs-read); line-height:1.7; resize:vertical; }
  .field-hint{ font-size:var(--fs-micro); color:var(--ink-3); }
  .field-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .field-row .field{ flex:1; min-width:150px; }

  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 15px; border-radius:var(--r-pill);
    font-size:var(--fs-cap); font-weight:600; background:var(--fill); color:var(--ink-2);
    border:1px solid transparent;
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  button.chip:hover{ background:var(--fill-2); color:var(--ink); }
  button.chip:active{ transform:scale(.95); }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
  .chip-form[aria-pressed="true"]{ background:var(--accent); color:#fff; }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:var(--r-pill);
    font-size:var(--fs-micro); font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    background:var(--accent-wash); color:var(--accent);
  }

  /* ================= LIBRARY ================= */
  .issue-head{ padding:52px 0 30px; }
  .issue-head-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; }
  .issue-title{
    font-family:var(--f-display); font-size:var(--fs-h1); font-weight:600; line-height:1.06;
    /* Wide enough that a real title gets two balanced lines rather than three
       cramped ones; still narrow enough that a short one does not stretch
       across the page. */
    letter-spacing:-.022em; text-wrap:balance; max-width:22ch;
  }
  .title-edit{
    display:inline-flex; align-items:center; gap:6px; margin-left:10px; padding:6px 12px;
    border-radius:var(--r-pill); background:var(--fill); color:var(--ink-2);
    font-family:var(--f-ui); font-size:var(--fs-micro); font-weight:600; vertical-align:middle;
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .title-edit:hover{ background:var(--fill-2); color:var(--ink); }
  .title-edit:active{ transform:scale(.94); }
  .title-edit svg{ width:13px; height:13px; }
  .issue-byline{ font-size:var(--fs-read); color:var(--ink-2); margin-top:12px; max-width:48ch; line-height:1.6; }
  .issue-count{ text-align:right; }
  .issue-count .n{ font-family:var(--f-ui); font-size:2rem; font-weight:700; letter-spacing:-.02em; line-height:1; display:block; }

  .toolbar{ display:flex; flex-direction:column; gap:14px; margin-bottom:22px; }
  .searchbar{
    display:flex; align-items:center; gap:10px; background:var(--fill); border-radius:var(--r-pill);
    padding:11px 18px; transition:background var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease);
  }
  .searchbar:focus-within{ background:var(--surface); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent), var(--shadow-1); }
  .searchbar svg{ width:16px; height:16px; color:var(--ink-3); flex-shrink:0; }
  /* min-width:0 matters here. A flex item will not shrink below the intrinsic
     width of its content by default, and this input's placeholder is long — so
     without it the sort control gets pushed off the edge of a small phone. */
  .searchbar input{ flex:1; min-width:0; background:none; border:none; padding:0; font-size:var(--fs-ui); }
  .searchbar input:focus{ outline:none; }
  .sort-select{
    background:var(--fill); border:none; border-radius:var(--r-pill); color:var(--ink-2);
    font-size:var(--fs-cap); font-weight:600; padding:9px 12px; cursor:pointer; flex-shrink:0;
  }
  .filter-line{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .filter-line > .label{ flex-shrink:0; }
  .filter-chips{ display:flex; gap:8px; flex-wrap:wrap; }

  .index-list{ display:flex; flex-direction:column; gap:14px; }
  .entry{
    display:grid; grid-template-columns:minmax(0,1fr) 168px; gap:28px; align-items:start;
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:26px 28px; text-align:left; width:100%; box-shadow:var(--shadow-1);
    position:relative; overflow:hidden;
    transition:transform var(--dur-m) var(--spring), box-shadow var(--dur-m) var(--ease), border-color var(--dur-s) var(--ease);
    animation:entry-in var(--dur-m) var(--ease) backwards;
  }
  @keyframes entry-in{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }
  .entry:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--border); }
  .entry:active{ transform:scale(.99); box-shadow:var(--shadow-1); }
  .entry-main{ min-width:0; display:block; }
  .entry-top{ display:flex; align-items:center; gap:10px; margin-bottom:11px; flex-wrap:wrap; }
  .entry-num{ font-size:var(--fs-micro); font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .entry-title{
    display:block; font-family:var(--f-display); font-size:clamp(1.45rem, 2.3vw, 1.9rem); font-weight:600;
    line-height:1.22; letter-spacing:-.012em; margin-bottom:10px; text-wrap:balance;
  }
  .entry-blurb{
    display:block; font-size:var(--fs-read); color:var(--ink-2); line-height:1.6; max-width:56ch;
  }
  .entry-blurb.is-empty{ color:var(--ink-3); font-style:italic; }
  .entry-side{ display:flex; flex-direction:column; align-items:flex-end; gap:11px; padding-top:2px; }
  .entry-date{ display:block; font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); }
  .entry-stats{ display:flex; gap:14px; }
  .entry-stat{ display:flex; align-items:center; gap:5px; font-size:var(--fs-cap); font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; }
  .entry-stat svg{ width:15px; height:15px; }
  .entry-stat.liked{ color:var(--like); }
  .entry-tags{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .entry-tag{ font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); }
  .entry-tag::before{ content:"·"; margin-right:6px; }
  .entry-tag:first-child::before{ content:""; margin:0; }

  .empty-state{ padding:80px 24px; text-align:center; background:var(--surface); border-radius:var(--r-lg); border:1px solid var(--hairline); }
  .empty-state h3{ font-family:var(--f-display); font-size:var(--fs-h3); font-weight:600; margin-bottom:8px; }
  .empty-state p{ color:var(--ink-2); }

  /* ================= READER ================= */
  .back-link{
    display:inline-flex; align-items:center; gap:5px; margin:22px 0 20px; padding:8px 14px 8px 10px;
    color:var(--accent); font-size:var(--fs-cap); font-weight:600; border-radius:var(--r-pill);
    transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .back-link:hover{ background:var(--accent-wash); }
  .back-link:active{ transform:scale(.95); }
  .back-link svg{ width:16px; height:16px; }

  .poem-head{ margin-bottom:26px; }
  .poem-head-meta{ display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .poem-head-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .poem-title{
    font-family:var(--f-display); font-size:clamp(2.1rem, 4.6vw, 3.4rem); font-weight:600;
    line-height:1.1; letter-spacing:-.022em; text-wrap:balance; max-width:20ch;
  }
  .poem-blurb{
    font-size:var(--fs-read); color:var(--ink-2); line-height:1.6; max-width:56ch; margin-top:14px;
  }
  .poem-body-grid{ display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:26px; align-items:start; }
  .poem-sheet{
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-xl);
    padding:clamp(30px, 4.4vw, 62px); box-shadow:var(--shadow-1);
  }
  .verse{
    font-family:var(--poem-font, var(--f-verse));
    font-size:calc(var(--poem-size, 1.2) * 1rem * var(--step));
    line-height:var(--poem-leading, 1.85); white-space:pre-wrap;
    text-align:var(--poem-align, left); color:var(--ink); max-width:46ch; margin:0 auto;
  }

  /* iOS inset grouped list */
  .poem-rail{ position:sticky; top:80px; display:flex; flex-direction:column; gap:14px; }
  .group{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-1); }
  .group-row{ padding:13px 16px; border-bottom:1px solid var(--hairline); }
  .group-row:last-child{ border-bottom:none; }
  .group-row .label{ display:block; margin-bottom:3px; }
  .group-val{ font-size:var(--fs-read); font-weight:600; line-height:1.35; }
  .group-val.serif{ font-family:var(--f-display); font-size:var(--fs-read); font-weight:600; }
  .group-note{ font-size:var(--fs-cap); color:var(--ink-3); line-height:1.5; margin-top:2px; }

  .engage{ display:flex; align-items:center; gap:12px; padding:24px 0 8px; flex-wrap:wrap; }
  .like-btn{
    display:inline-flex; align-items:center; gap:9px; padding:11px 20px; border-radius:var(--r-pill);
    background:var(--fill); color:var(--ink-2); font-size:var(--fs-cap); font-weight:600;
    font-variant-numeric:tabular-nums;
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .like-btn:hover{ background:var(--fill-2); color:var(--ink); }
  .like-btn:active{ transform:scale(.95); }
  .like-btn svg{ width:19px; height:19px; transition:transform var(--dur-s) var(--spring); }
  .like-btn[aria-pressed="true"]{ background:var(--like-wash); color:var(--like); }
  .like-btn.pulse svg{ animation:heart-pop 520ms var(--spring); }
  @keyframes heart-pop{
    0%{ transform:scale(1);} 30%{ transform:scale(1.45) rotate(-8deg);} 55%{ transform:scale(.88);}
    75%{ transform:scale(1.12);} 100%{ transform:scale(1);}
  }
  .readonly-note{ font-size:var(--fs-cap); color:var(--ink-3); }

  /* ================= COMMENTS ================= */
  .comments{ padding:28px 0 8px; max-width:660px; }
  .comments-head{ display:flex; align-items:center; gap:9px; margin-bottom:16px; }
  .comments-head h3{ font-size:var(--fs-read); font-weight:700; }
  .comments-count{
    font-size:var(--fs-micro); font-weight:700; background:var(--fill); color:var(--ink-2);
    padding:3px 9px; border-radius:var(--r-pill); font-variant-numeric:tabular-nums;
  }
  .comment-form{
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:14px; margin-bottom:20px; box-shadow:var(--shadow-1);
    transition:box-shadow var(--dur-s) var(--ease), border-color var(--dur-s) var(--ease);
  }
  .comment-form:focus-within{ border-color:var(--border); box-shadow:var(--shadow-2); }
  .cf-name{
    background:none; border:none; padding:2px 2px 10px; width:100%; font-weight:600; font-size:var(--fs-cap);
    border-bottom:1px solid var(--hairline); margin-bottom:11px;
  }
  .cf-name:focus{ outline:none; border-bottom-color:var(--accent); }
  .cf-name::placeholder{ color:var(--ink-3); font-weight:500; }
  .cf-bottom{ display:flex; align-items:flex-end; gap:10px; }
  .cf-text{
    flex:1; background:none; border:none; padding:4px 2px; resize:none; min-height:26px; max-height:180px;
    font-size:var(--fs-read); line-height:1.6;
  }
  .cf-text:focus{ outline:none; }
  .cf-text::placeholder{ font-family:var(--f-ui); font-size:var(--fs-ui); color:var(--ink-3); }
  .cf-send{
    width:36px; height:36px; border-radius:var(--r-pill); background:var(--accent); color:#fff;
    display:grid; place-items:center; flex-shrink:0;
    transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--spring), opacity var(--dur-s) var(--ease);
  }
  .cf-send svg{ width:17px; height:17px; }
  .cf-send:hover{ background:var(--accent-2); }
  .cf-send:active{ transform:scale(.88); }
  .cf-send[disabled]{ background:var(--fill-2); color:var(--ink-3); cursor:not-allowed; transform:none; }

  .comment-list{ display:flex; flex-direction:column; gap:10px; }
  .comment{
    display:flex; gap:12px; padding:14px 16px; background:var(--surface);
    border:1px solid var(--hairline); border-radius:var(--r-md);
    animation:entry-in var(--dur-m) var(--ease);
  }
  .comment-avatar{
    width:34px; height:34px; border-radius:var(--r-pill); flex-shrink:0; display:grid; place-items:center;
    background:var(--accent-wash); color:var(--accent); font-weight:700; font-size:var(--fs-cap);
  }
  .comment-body{ flex:1; min-width:0; }
  .comment-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:2px; flex-wrap:wrap; }
  .comment-author{ font-weight:700; font-size:var(--fs-cap); }
  .comment-time{ font-size:var(--fs-micro); color:var(--ink-3); }
  .comment-text{ font-size:var(--fs-read); line-height:1.6; white-space:pre-wrap; color:var(--ink); }
  .comment-del{ font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); margin-top:7px; }
  .comment-del:hover{ color:var(--like); }
  .comments-empty{ padding:22px; text-align:center; color:var(--ink-3); font-size:var(--fs-cap); background:var(--fill); border-radius:var(--r-md); }

  /* ================= READING NOTES ================= */
  .notes-toggle{ padding:18px 0 40px; }
  .notes{ animation:view-in var(--dur-m) var(--ease); padding-top:8px; }
  .notes-masthead{ margin-bottom:22px; }
  .notes-masthead h2{ font-family:var(--f-display); font-size:var(--fs-h2); font-weight:600; letter-spacing:-.018em; line-height:1.14; margin-top:8px; }
  .notes-standfirst{ font-size:var(--fs-read); color:var(--ink-2); line-height:1.6; max-width:52ch; margin-top:8px; }

  .note-sec{
    display:grid; grid-template-columns:158px minmax(0,1fr); gap:26px; align-items:start;
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:26px 28px; margin-bottom:14px; box-shadow:var(--shadow-1);
  }
  .note-sec-label{ position:sticky; top:82px; }
  .note-sec-label .label{ display:block; }
  .note-figure{ font-family:var(--f-ui); font-size:1.75rem; font-weight:700; letter-spacing:-.02em; line-height:1.05; margin-top:8px; }
  .note-figure-unit{ display:block; font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); margin-top:4px; letter-spacing:0; text-transform:none; }
  .note-body{ max-width:62ch; }
  .note-body p{ font-size:var(--fs-read); line-height:1.72; color:var(--ink); }
  .note-body p + p{ margin-top:12px; }
  .note-body em{ font-family:var(--f-verse); font-style:italic; }
  .note-body b{ font-weight:700; }
  .quote{
    font-family:var(--f-verse); font-size:var(--fs-read); line-height:1.7; color:var(--ink);
    background:var(--fill); border-radius:var(--r-md); padding:14px 18px; margin:14px 0; white-space:pre-line;
    border-left:3px solid var(--accent);
  }
  .quote-src{ display:block; font-family:var(--f-ui); font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); margin-top:8px; white-space:normal; }

  .lexicon{ display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 14px; align-items:center; }
  .lex-word{
    font-family:var(--f-verse); color:var(--ink); line-height:1.2; background:var(--fill);
    padding:7px 13px; border-radius:var(--r-pill); display:inline-flex; align-items:baseline; gap:5px;
    transition:transform var(--dur-s) var(--spring), background var(--dur-s) var(--ease);
  }
  .lex-word:hover{ transform:translateY(-2px); background:var(--fill-2); }
  .lex-word .c{ font-family:var(--f-ui); font-size:var(--fs-micro); font-weight:700; color:var(--ink-3); }
  .lex-1{ font-size:1.32rem; font-weight:600; background:var(--accent-wash); color:var(--accent); }
  .lex-1 .c{ color:var(--accent); opacity:.7; }
  .lex-2{ font-size:1.14rem; font-weight:500; }
  .lex-3{ font-size:1rem; }
  .lex-4{ font-size:.92rem; color:var(--ink-2); }

  .field-bars{ display:flex; flex-direction:column; gap:9px; margin-top:12px; }
  .field-bar{ display:grid; grid-template-columns:116px minmax(0,1fr) 28px; gap:12px; align-items:center; }
  .field-bar .fname{ font-size:var(--fs-cap); font-weight:600; color:var(--ink-2); }
  .field-bar .ftrack{ height:7px; background:var(--fill); border-radius:var(--r-pill); overflow:hidden; }
  .field-bar .ffill{ display:block; height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width var(--dur-m) var(--ease); }
  .field-bar .fcount{ font-size:var(--fs-micro); font-weight:600; color:var(--ink-3); text-align:right; font-variant-numeric:tabular-nums; }

  .caveat{
    font-size:var(--fs-cap); color:var(--ink-3); line-height:1.65; background:var(--fill);
    border-radius:var(--r-md); padding:16px 20px; margin-top:16px; max-width:66ch;
  }

  /* ================= COLLECTION ================= */
  .coll-head{ padding:52px 0 26px; }
  .coll-title{ font-family:var(--f-display); font-size:var(--fs-h1); font-weight:600; line-height:1.06; letter-spacing:-.022em; max-width:16ch; margin-top:8px; }
  .coll-standfirst{ font-size:var(--fs-read); color:var(--ink-2); line-height:1.6; max-width:54ch; margin-top:12px; }

  .coll-figures{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .coll-fig{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:20px 22px; box-shadow:var(--shadow-1);
    transition:transform var(--dur-m) var(--spring), box-shadow var(--dur-m) var(--ease); }
  .coll-fig:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); }
  .coll-fig .n{ font-family:var(--f-ui); font-size:1.95rem; font-weight:700; letter-spacing:-.025em; line-height:1; display:block; }
  .coll-fig .label{ display:block; margin-top:8px; }

  .coll-sec{
    display:grid; grid-template-columns:158px minmax(0,1fr); gap:26px; align-items:start;
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:26px 28px; margin-bottom:14px; box-shadow:var(--shadow-1);
  }
  .coll-sec-label{ position:sticky; top:82px; }
  .coll-sec-body > p{ font-size:var(--fs-read); line-height:1.72; max-width:60ch; }
  .coll-sec-body > p + p{ margin-top:12px; }

  .form-list{ display:flex; flex-direction:column; }
  .form-row{ display:grid; grid-template-columns:130px minmax(0,1fr) 34px; gap:14px; align-items:center; padding:11px 0; border-bottom:1px solid var(--hairline); }
  .form-row:last-child{ border-bottom:none; }
  .form-row .fname{ font-family:var(--f-ui); font-size:var(--fs-read); font-weight:600; }
  .form-row .ftrack{ height:7px; background:var(--fill); border-radius:var(--r-pill); overflow:hidden; }
  .form-row .ffill{ display:block; height:100%; border-radius:var(--r-pill); background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .form-row .fcount{ text-align:right; font-size:var(--fs-cap); font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums; }

  .trend-pair{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .trend{ background:var(--fill); border-radius:var(--r-md); padding:16px 18px; }
  .trend .label{ display:block; margin-bottom:10px; }
  .trend svg{ width:100%; height:auto; overflow:visible; }
  .trend .tline{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .trend .tarea{ fill:var(--accent); opacity:.09; }
  .trend .tdot{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
  .trend .tdot.end{ fill:var(--like); stroke:var(--like); }
  .trend .tbase{ stroke:var(--hairline); stroke-width:1; }
  .trend text{ fill:var(--ink-3); font-family:var(--f-ui); font-size:8.5px; font-weight:600; }
  .trend-read{ font-size:var(--fs-cap); color:var(--ink-2); margin-top:8px; line-height:1.5; }

  .lex-collection{ display:flex; flex-direction:column; }
  .lex-row{ display:grid; grid-template-columns:150px minmax(0,1fr); gap:18px; align-items:center; padding:12px 0; border-bottom:1px solid var(--hairline); }
  .lex-row:last-child{ border-bottom:none; }
  .lex-row .w{ font-family:var(--f-verse); font-size:1.1rem; font-weight:600; }
  .lex-row .w .c{ font-family:var(--f-ui); font-size:var(--fs-micro); font-weight:700; color:var(--ink-3); margin-left:6px; }
  .lex-row .where{ font-size:var(--fs-cap); color:var(--ink-3); line-height:1.5; }

  /* ================= OVERLAYS ================= */
  .scrim{
    position:fixed; inset:0; background:rgba(10,11,14,.42);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; padding:22px; z-index:100;
    animation:fade-in var(--dur-s) var(--ease);
  }
  @keyframes fade-in{ from{opacity:0} to{opacity:1} }
  .modal{
    background:var(--bg); max-width:600px; width:100%; max-height:88vh; overflow-y:auto;
    padding:28px 28px 24px; border-radius:var(--r-xl); box-shadow:var(--shadow-3);
    animation:sheet-in var(--dur-m) var(--spring);
  }
  @keyframes sheet-in{ from{ opacity:0; transform:translateY(24px) scale(.97);} to{ opacity:1; transform:none;} }
  .modal h2{ font-family:var(--f-display); font-size:var(--fs-h3); font-weight:600; letter-spacing:-.015em; line-height:1.2; margin-bottom:8px; }
  .modal-sub{ color:var(--ink-2); font-size:var(--fs-cap); line-height:1.6; margin-bottom:22px; max-width:52ch; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:9px; margin-top:14px; }
  .modal-wrap{ position:relative; }

  /* --- PIN pad ---------------------------------------------------------
     Sized for someone who does not want to squint or aim. Every key is a
     comfortable target, the digits are large, and the whole thing works from
     a physical keyboard too. */
  .pin-dots{
    display:flex; justify-content:center; gap:12px; margin:4px 0 20px; min-height:20px;
  }
  .pin-dot{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--ink-3);
    transition:background var(--dur-s) ease, transform var(--dur-s) var(--spring), border-color var(--dur-s) ease;
  }
  .pin-dot.is-filled{ background:var(--accent); border-color:var(--accent); transform:scale(1.12); }
  .pin-pad{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-bottom:6px;
  }
  .pin-key{
    -webkit-appearance:none; appearance:none; cursor:pointer;
    min-height:64px; border-radius:var(--r-lg);
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    font-family:var(--f-ui); font-size:1.6rem; font-weight:500; font-variant-numeric:tabular-nums;
    box-shadow:var(--shadow-1);
    transition:background var(--dur-s) ease, transform var(--dur-s) var(--spring), border-color var(--dur-s) ease;
  }
  .pin-key:hover{ background:var(--surface-2); border-color:var(--ink-3); }
  .pin-key:active{ transform:scale(.95); background:var(--accent-wash); border-color:var(--accent); }
  .pin-key:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .pin-key.is-quiet{ font-size:var(--fs-cap); font-weight:600; color:var(--ink-2); box-shadow:none; background:transparent; border-color:transparent; }
  .pin-key.is-quiet:hover{ background:var(--surface-2); }
  .pin-key[disabled]{ opacity:.35; cursor:default; transform:none; }
  .pin-error{ color:var(--like); font-size:var(--fs-cap); line-height:1.5; min-height:1.5em; margin-bottom:10px; text-align:center; }
  .pin-note{ color:var(--ink-3); font-size:var(--fs-micro); text-align:center; margin-top:14px; line-height:1.6; }
  .linkish{
    background:none; border:0; padding:0; cursor:pointer; color:var(--accent);
    font:inherit; text-decoration:underline; text-underline-offset:2px;
  }
  .linkish:hover{ color:var(--accent-2); }
  @media (prefers-reduced-motion: reduce){
    .pin-dot, .pin-key{ transition:none; }
    .pin-key:active{ transform:none; }
  }

  .popover{
    position:absolute; top:100%; right:0; margin-top:9px; background:var(--surface);
    border:1px solid var(--hairline); padding:8px; width:296px; z-index:90;
    border-radius:var(--r-lg); box-shadow:var(--shadow-3);
    animation:sheet-in var(--dur-s) var(--spring); transform-origin:top right;
  }
  .popover > .label{ display:block; padding:8px 10px 6px; }
  .a11y-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 10px; border-radius:var(--r-sm); }
  .a11y-row + .a11y-row{ border-top:1px solid var(--hairline); }
  .a11y-row-label{ font-size:var(--fs-cap); font-weight:600; }
  .a11y-row-desc{ font-size:var(--fs-micro); color:var(--ink-3); }
  .stepper{ display:flex; align-items:center; background:var(--fill); border-radius:var(--r-pill); padding:2px; }
  .stepper button{ width:30px; height:28px; display:grid; place-items:center; border-radius:var(--r-pill); color:var(--ink-2); font-weight:600;
    transition:background var(--dur-s) var(--ease), transform var(--dur-s) var(--spring); }
  .stepper button:hover{ background:var(--surface); color:var(--ink); }
  .stepper button:active{ transform:scale(.9); }
  .stepper span{ min-width:44px; text-align:center; font-size:var(--fs-micro); font-weight:700; font-variant-numeric:tabular-nums; }

  /* iOS toggle */
  .switch{
    width:46px; height:28px; border-radius:var(--r-pill); background:var(--fill-2);
    position:relative; flex-shrink:0; transition:background var(--dur-m) var(--ease);
  }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:var(--r-pill);
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.28);
    transition:transform var(--dur-m) var(--spring);
  }
  .switch[aria-checked="true"]{ background:var(--accent); }
  .switch[aria-checked="true"]::after{ transform:translateX(18px); }

  .toast-stack{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; align-items:center; }
  .toast{
    background:color-mix(in srgb, var(--ink) 92%, transparent); color:var(--bg);
    padding:12px 22px; border-radius:var(--r-pill); font-size:var(--fs-cap); font-weight:600;
    box-shadow:var(--shadow-3); backdrop-filter:blur(12px);
    animation:toast-in var(--dur-m) var(--spring);
  }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(16px) scale(.94);} to{ opacity:1; transform:none;} }

  .style-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .align-opt{ min-width:56px; padding:8px 14px; border-radius:var(--r-pill); background:var(--fill); font-size:var(--fs-cap); font-weight:600; color:var(--ink-2);
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring); }
  .align-opt:active{ transform:scale(.95); }
  .align-opt[aria-pressed="true"]{ background:var(--accent); color:#fff; }
  .preview-sheet{ background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-md); padding:18px 20px; }
  /* ---------- author highlights ---------- */
  mark.hl{
    color:inherit; border-radius:7px; padding:.06em .24em; margin:0 -.06em;
    background-color:transparent;
    background-image:linear-gradient(
      color-mix(in srgb, var(--tint,var(--accent)) 22%, transparent),
      color-mix(in srgb, var(--tint,var(--accent)) 22%, transparent));
    background-repeat:no-repeat; background-size:100% 100%;
    box-decoration-break:clone; -webkit-box-decoration-break:clone;
    animation:hl-sweep 520ms var(--ease) backwards; animation-delay:var(--d,0ms);
  }
  @keyframes hl-sweep{ from{ background-size:0% 100%; } to{ background-size:100% 100%; } }
  :root[data-contrast="high"] mark.hl{
    background-image:none;
    background-color:color-mix(in srgb, var(--tint,var(--accent)) 30%, transparent);
    box-shadow:inset 0 -2px 0 var(--tint,var(--accent));
    animation:none;
  }

  .hl-toggle{
    display:inline-flex; align-items:center; gap:9px; padding:11px 18px; border-radius:var(--r-pill);
    background:var(--fill); color:var(--ink-2); font-size:var(--fs-cap); font-weight:600;
    transition:background var(--dur-s) var(--ease), color var(--dur-s) var(--ease), transform var(--dur-s) var(--spring);
  }
  .hl-toggle:hover{ background:var(--fill-2); color:var(--ink); }
  .hl-toggle:active{ transform:scale(.95); }
  .hl-toggle svg{ width:17px; height:17px; }
  .hl-toggle[aria-pressed="true"]{ background:color-mix(in srgb, var(--tint,var(--accent)) 16%, transparent); color:var(--tint,var(--accent)); }
  .hl-count{
    font-size:var(--fs-micro); font-weight:700; background:var(--fill-2); color:var(--ink-3);
    padding:2px 8px; border-radius:var(--r-pill); font-variant-numeric:tabular-nums;
  }
  .hl-toggle[aria-pressed="true"] .hl-count{ background:color-mix(in srgb, var(--tint,var(--accent)) 22%, transparent); color:inherit; }

  /* ---------- highlight picker ---------- */
  .picker-modal{ max-width:760px; }
  .picker-stage{
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:26px 28px; margin-bottom:14px; max-height:46vh; overflow-y:auto;
    -webkit-user-select:none; user-select:none; touch-action:pan-y;
  }
  .picker-verse{
    font-family:var(--f-verse); font-size:var(--fs-verse); line-height:2; white-space:pre-wrap; color:var(--ink);
  }
  .wtok{

      return '<span class="wtok'+(on?' on':'')+'" data-wi="'+tk.i+'" role="button" tabindex="0"'+
        ' aria-pressed="'+on+'" aria-label="'+esc(tk.s)+'">'+esc(tk.s)+'</span>';
    }
    if(!on) return esc(tk.s);
    return '<mark class="hl" style="--d:'+(n++*45)+'ms">'+esc(tk.s)+'</mark>';
  }).join('');
}

function defaultPoemStyle(){ return {font:'serif',size:1.22,leading:1.85,align:'left',accent:'#3B6FD4'}; }
function poemStyleVars(s){
  var id=normalizeFont(s.font), css='var(--f-serif)';
  POEM_FONTS.forEach(function(f){ if(f.id===id) css=f.css; });

}

/* ================= LANGUAGE ANALYSIS ================= */
function tokenize(text){
  var m=(text.toLowerCase().match(/[a-z][a-z']*/g))||[];
  return m.map(function(w){ return w.replace(/^'+|'+$/g,''); }).filter(Boolean);
}
function getLines(body){ return body.split(/\r?\n/).filter(function(l){ return l.trim()!==''; }); }
function getStanzas(body){
  return body.split(/\n\s*\n/).map(function(s){ return s.split(/\r?\n/).filter(function(l){ return l.trim()!==''; }); })
    .filter(function(st){ return st.length; });
}
var IRREGULAR={};
("held:hold,holds:hold,holding:hold,told:tell,kept:keep,left:leave,felt:feel,made:make,went:go,gone:go,"+
 "came:come,took:take,taken:take,gave:give,given:give,saw:see,seen:see,knew:know,known:know,grew:grow,"+
 "grown:grow,rose:rise,risen:rise,fell:fall,fallen:fall,sang:sing,sung:sing,ran:run,sat:sit,stood:stand,"+
 "found:find,lost:lose,sent:send,spent:spend,built:build,caught:catch,taught:teach,brought:bring,"+
 "thought:think,bought:buy,wore:wear,worn:wear,broke:break,broken:break,spoke:speak,spoken:speak,"+
 "wrote:write,written:write,drove:drive,driven:drive,chose:choose,froze:freeze,frozen:freeze,woke:wake,"+
 "woken:wake,swore:swear,tore:tear,torn:tear,slept:sleep,wept:weep,crept:creep,swept:sweep,dug:dig,"+
 "hung:hang,swung:swing,sank:sink,sunk:sink,drank:drink,drunk:drink,began:begin,begun:begin,"+
 "children:child,men:man,women:woman,feet:foot,teeth:tooth,leaves:leaf,lives:life,knives:knife,"+
 "wives:wife,selves:self,shelves:shelf,halves:half,loaves:loaf,thieves:thief"
).split(",").forEach(function(pair){ var kv=pair.split(":"); IRREGULAR[kv[0]]=kv[1]; });

function stemOf(w){
  if(IRREGULAR[w]) return IRREGULAR[w];
  var s=w;
  if(s.length>4 && /ies$/.test(s)) s=s.slice(0,-3)+'y';
  else if(s.length>4 && /(ses|xes|zes|ches|shes)$/.test(s)) s=s.slice(0,-2);
  else if(s.length>3 && /s$/.test(s) && !/(ss|us|is)$/.test(s)) s=s.slice(0,-1);
  if(s.length>5 && /ing$/.test(s)) s=s.slice(0,-3);
  else if(s.length>4 && /ed$/.test(s)) s=s.slice(0,-2);
  if(s.length>3 && /([bdfglmnprt])\1$/.test(s)) s=s.slice(0,-1);
  if(s.length>3 && /e$/.test(s)) s=s.slice(0,-1);
  return s||w;
}
function countSyllables(raw){
  var w=raw.toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return 0;
  if(w.length<=3) return 1;
  w=w.replace(/(?:es|ed)$/,'').replace(/e$/,'');
  var m=w.match(/[aeiouy]+/g);
  return m?Math.max(1,m.length):1;
}
var VOWEL_NORM={ea:'e',ee:'e',ie:'e',ei:'e',ey:'e',ai:'a',ay:'a',oa:'o',ow:'o',oo:'u',au:'o',aw:'o',oy:'oi',ue:'u',ui:'u',y:'i',eau:'o'};
/* rhyme core: last vowel nucleus + the consonants after it, normalised for spelling */
function rhymeCore(raw){
  var w=raw.toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return null;
  /* silent -e, and the silent e of a regular -ed ending */
  if(/[^aeiou]ed$/.test(w) && !/[td]ed$/.test(w)) w=w.slice(0,-2)+w.slice(-1);
  else if(w.length>3 && /e$/.test(w) && !/[aeiou]e$/.test(w)) w=w.slice(0,-1);
  var m=w.match(/([aeiouy]+)([^aeiouy]*)$/);
  if(!m) return {v:w.slice(-2),c:''};
  var v=m[1];
  return { v:(VOWEL_NORM[v]||v.charAt(0)), c:m[2] };
}
function rhymeKey(raw){
  var r=rhymeCore(raw);
  return r?r.v+r.c:'';
}
/* true rhyme or close slant rhyme */
function rhymesWith(a,b){
  if(!a||!b) return false;
  if(a.v!==b.v) return false;
  if(a.c===b.c) return true;
  if(!a.c||!b.c) return false;
  return a.c.charAt(0)===b.c.charAt(0) && Math.abs(a.c.length-b.c.length)<=1;
}
function endWordCores(stanza){
  return stanza.map(function(l){ var ws=tokenize(l); return ws.length?rhymeCore(ws[ws.length-1]):null; });
}
/* count how many line endings participate in a rhyme, using fuzzy matching */
function rhymeStats(stanzas){
  var rhymed=0,total=0;
  stanzas.forEach(function(st){
    var cores=endWordCores(st).filter(Boolean);
    total+=cores.length;
    var used=cores.map(function(){ return false; });
    for(var i=0;i<cores.length;i++){
      for(var j=i+1;j<cores.length;j++){
        if(rhymesWith(cores[i],cores[j])){ used[i]=true; used[j]=true; }
      }
    }
    used.forEach(function(u){ if(u) rhymed++; });
  });
  return { rhymed:rhymed, total:total, density: total?rhymed/total:0 };
}
var DIGRAPHS=['th','sh','ch','wh','ph','str','spr','scr','st','sp','sc','sk','sl','sm','sn','sw','tr','br','cr','dr','fr','gr','pr','gl','bl','cl','fl','pl'];
function initialSound(w){
  var s=w.toLowerCase().replace(/[^a-z]/g,'');
  for(var i=0;i<DIGRAPHS.length;i++){ if(s.indexOf(DIGRAPHS[i])===0) return DIGRAPHS[i]; }
  return s.charAt(0);
}
function vowelSound(w){
  var s=w.toLowerCase().replace(/[^a-z]/g,'');
  var m=s.match(/[aeiouy]+/);
  return m?m[0]:'';
}
function mode(arr){
  if(!arr.length) return 0;
  var t={},best=arr[0],bc=0;
  arr.forEach(function(v){ t[v]=(t[v]||0)+1; });
  Object.keys(t).forEach(function(k){ if(t[k]>bc){ bc=t[k]; best=+k; } });
  return best;
}
function schemeOf(stanza){
  var cores=endWordCores(stanza);
  var groups=[],out=[];
  cores.forEach(function(c){
    if(!c){ out.push('-'); return; }
    var found=-1;
    for(var i=0;i<groups.length;i++){ if(rhymesWith(groups[i],c)){ found=i; break; } }
    if(found<0){ groups.push(c); found=groups.length-1; }
    out.push(String.fromCharCode(65+found));
  });
  return out.join('');
}

/* key words: content words, stemmed, ranked by count and weight */
function keyWords(body,limit){
  var words=tokenize(body);
  var groups={};
  words.forEach(function(w){
    if(HARD_STOP[w] || w.length<3) return;
    var st=stemOf(w);
    if(!groups[st]) groups[st]={stem:st,count:0,surfaces:{}};
    groups[st].count++;
    groups[st].surfaces[w]=(groups[st].surfaces[w]||0)+1;
  });
  var out=Object.keys(groups).map(function(st){
    var g=groups[st];
    var best='',bc=0;
    Object.keys(g.surfaces).forEach(function(s){ if(g.surfaces[s]>bc || (g.surfaces[s]===bc && s.length<best.length)){ bc=g.surfaces[s]; best=s; } });
    var light=!!(LIGHT_WORD[best]||LIGHT_WORD[st]);
    return { word:best, stem:st, count:g.count, light:light, weight:g.count*(light?0.4:1)*(FIELD_LOOKUP[best]?1.15:1) };
  });
  out.sort(function(a,b){ return b.weight-a.weight || b.count-a.count || a.word.localeCompare(b.word); });
  return limit ? out.slice(0,limit) : out;
}

function imageFieldCounts(body){
  var words=tokenize(body);
  var counts={},examples={};
  IMAGE_FIELDS.forEach(function(f){ counts[f.key]=0; examples[f.key]={}; });
  words.forEach(function(w){
    var k=FIELD_LOOKUP[w];
    if(k){ counts[k]++; examples[k][w]=(examples[k][w]||0)+1; }
  });
  return IMAGE_FIELDS.map(function(f){
    var ex=Object.keys(examples[f.key]).sort(function(a,b){ return examples[f.key][b]-examples[f.key][a]; }).slice(0,4);
    return { key:f.key, name:f.name, count:counts[f.key], examples:ex };
  }).sort(function(a,b){ return b.count-a.count; });
}

/* ---------------- form classification ---------------- */
function classifyForm(body,title){
  var lines=getLines(body), stanzas=getStanzas(body), words=tokenize(body);
  var n=lines.length, wc=words.length;
  var syl=lines.map(function(l){ return tokenize(l).reduce(function(s,w){ return s+countSyllables(w); },0); });
  var schemes=stanzas.map(schemeOf);
  var sizes=stanzas.map(function(s){ return s.length; });
  var uniform=sizes.length>1 && sizes.every(function(s){ return s===sizes[0]; });
  var avgWordsPerLine=n?wc/n:0;

  var rhymeDensity=rhymeStats(stanzas).density;
  var pentameter=syl.filter(function(s){ return Math.abs(s-10)<=1; }).length;
  var pentameterRatio=n?pentameter/n:0;

  var starts={};
  lines.forEach(function(l){ var ws=tokenize(l); if(ws[0]) starts[ws[0]]=(starts[ws[0]]||0)+1; });
  var maxAnaphora=0,anaWord='';
  Object.keys(starts).forEach(function(k){ if(starts[k]>maxAnaphora){ maxAnaphora=starts[k]; anaWord=k; } });

  var addressHits=0; words.forEach(function(w){ if(ADDRESS_WORDS[w]) addressHits++; });
  var addressRatio=wc?addressHits/wc:0;
  var praiseHits={}; words.forEach(function(w){ if(PRAISE_WORDS.indexOf(w)>=0) praiseHits[w]=1; });
  var praiseCount=Object.keys(praiseHits).length;
  var griefHits={}; words.forEach(function(w){ if(GRIEF_WORDS.indexOf(w)>=0) griefHits[w]=1; });
  var griefCount=Object.keys(griefHits).length;

  var t=(title||'').trim();
  var titleOde=/^ode\b/i.test(t) || /^to\s+(?:a|an|the|my|his|her|our|your)?\s*\S/i.test(t);
  var titleElegy=/\belegy\b|\bin memoriam\b|\brequiem\b|\blament\b/i.test(t);

  var structure;
  if(!sizes.length) structure='a single passage';
  else if(uniform){
    var nameBySize={1:'single lines',2:'couplets',3:'tercets',4:'quatrains',5:'quintains',6:'sestets',8:'octaves'};
    structure=(nameBySize[sizes[0]]||(sizes[0]+'-line stanzas'));
    structure=sizes.length+' '+(sizes.length===1?structure.replace(/s$/,''):structure);
  } else if(sizes.length===1) structure='one unbroken stanza of '+n+' lines';
  else structure=sizes.length+' stanzas of uneven length ('+sizes.join('–')+' lines)';

  function res(form,family,evidence){ return {form:form,family:family,structure:structure,evidence:evidence,
    rhymeDensity:rhymeDensity, maxAnaphora:maxAnaphora, anaWord:anaWord, syllableMode:mode(syl),
    avgWordsPerLine:avgWordsPerLine, schemes:schemes, uniform:uniform, stanzaSizes:sizes}; }

  /* fixed forms first */
  if(n===3 && syl.reduce(function(a,b){ return a+b; },0)<=20)
    return res('Haiku','fixed','Three lines, '+syl.join('–')+' syllables — within the compass of haiku.');
  if(n===5 && Math.abs(syl[0]-5)<=1 && Math.abs(syl[1]-7)<=1 && Math.abs(syl[2]-5)<=1)
    return res('Tanka','fixed','Five lines running '+syl.join('–')+' syllables, close to the 5-7-5-7-7 of tanka.');
  if(n===5 && schemes.length===1 && /^AABBA$/.test(schemes[0]))
    return res('Limerick','fixed','Five lines rhyming AABBA.');
  if(n===14 && rhymeDensity>0.3){
    var kind=(schemes.join('')==='ABABCDCDEFEFGG')?'the Shakespearean pattern':'a sonnet pattern';
    return res('Sonnet','fixed','Fourteen rhymed lines following '+kind+'.');
  }
  if(n===19 && stanzas.length===6)
    return res('Villanelle','fixed','Nineteen lines in five tercets and a closing quatrain.');

  /* modes */
  if(titleOde) return res('Ode','mode','The title addresses its subject directly — the gesture of an ode: praise turned toward one thing.');
  if(addressRatio>0.022 && praiseCount>=2)
    return res('Ode','mode','It speaks to its subject throughout and reaches for praise ('+listJoin(Object.keys(praiseHits).slice(0,3).map(function(w){ return '“'+w+'”'; }))+') — an ode in everything but title.');
  if(titleElegy || griefCount>=4)
    return res('Elegy','mode','The vocabulary of loss runs through it ('+listJoin(Object.keys(griefHits).slice(0,3).map(function(w){ return '“'+w+'”'; }))+') — the poem is doing the work of an elegy.');
  if(n>=6 && maxAnaphora>=Math.max(3,Math.round(n*0.4)))
    return res('Catalogue','mode','“'+anaWord+'” opens '+maxAnaphora+' of the '+n+' lines — the poem accumulates by listing.');
  if(avgWordsPerLine>=14 && n<=6)
    return res('Prose poem','mode','Long unbroken lines averaging '+Math.round(avgWordsPerLine)+' words — the poem runs as prose does.');

  /* structural fallbacks */
  if(rhymeDensity>=0.45 && uniform && sizes[0]===4){
    var sc=schemes[0]||'';
    if(sc==='ABCB' || sc==='ABAB' || sc==='AABB')
      return res('Ballad','structure','Rhymed quatrains ('+sc+') in the old ballad shape.');
    return res('Lyric','structure','Rhymed quatrains, rhyming '+listJoin(schemes.slice(0,3))+'.');
  }
  if(rhymeDensity>=0.4)
    return res('Lyric','structure','Rhyme carries roughly '+Math.round(rhymeDensity*100)+'% of the line endings, in '+structure+'.');
  if(rhymeDensity<0.15 && pentameterRatio>=0.6 && n>=8)
    return res('Blank verse','structure',Math.round(pentameterRatio*100)+'% of the lines hold near ten syllables, unrhymed — blank verse measure.');
  return res('Free verse','structure','No fixed rhyme or measure; the poem sets its own line, in '+structure+'.');
}

/* ---------------- full analysis ---------------- */
function analyzePoem(body,title){
  var lines=getLines(body), stanzas=getStanzas(body), words=tokenize(body);
  var wc=words.length;
  var uniq={}; words.forEach(function(w){ uniq[w]=1; });
  var uniqueCount=Object.keys(uniq).length;

  var keys=keyWords(body);
  var fields=imageFieldCounts(body);
  var form=classifyForm(body,title);

  /* repeated phrases from content-bearing pairs */
  var bigrams={};
  for(var i=0;i<words.length-1;i++){
    var a=words[i],b=words[i+1];
    if(HARD_STOP[a] && HARD_STOP[b]) continue;
    var bg=a+' '+b;
    bigrams[bg]=(bigrams[bg]||0)+1;
  }
  var repeatedPhrases=Object.keys(bigrams).filter(function(k){ return bigrams[k]>1; })
    .map(function(k){ return {phrase:k,count:bigrams[k]}; })
    .sort(function(a,b){ return b.count-a.count; }).slice(0,4);

  /* alliteration with the actual sound and words */
  var allit=[];
  lines.forEach(function(l){
    var ws=tokenize(l).filter(function(w){ return !HARD_STOP[w]; });
    var sounds=ws.map(initialSound);
    for(var j=0;j<sounds.length-1;j++){
      if(sounds[j] && sounds[j]===sounds[j+1]){
        allit.push({line:l.trim(), sound:sounds[j], words:[ws[j],ws[j+1]]});
        break;
      }
    }
  });

  /* assonance: repeated vowel sounds among content words in a line */
  var assonance=[];
  lines.forEach(function(l){
    var ws=tokenize(l).filter(function(w){ return !HARD_STOP[w] && w.length>2; });
    var seen={};
    for(var j=0;j<ws.length;j++){
      var v=vowelSound(ws[j]);
      if(!v) continue;
      if(seen[v] && seen[v]!==ws[j]){ assonance.push({line:l.trim(),vowel:v,words:[seen[v],ws[j]]}); break; }
      seen[v]=ws[j];
    }
  });

  /* line endings */
  var stopped=lines.filter(function(l){ return /[.,;:!?—–-]\s*$/.test(l.trim()); }).length;
  var enjambRatio=lines.length?1-(stopped/lines.length):0;
  var enjambExamples=[];
  for(var k=0;k<lines.length-1;k++){
    if(!/[.,;:!?—–-]\s*$/.test(lines[k].trim())){
      enjambExamples.push(lines[k].trim()+'\n'+lines[k+1].trim());
      if(enjambExamples.length>=2) break;
    }
  }

  /* figurative language */
  var similes=[];
  var simRe=/([A-Za-z',\s]{3,40}?)\b(like|as)\b\s+((?:a|an|the|my|his|her|its|their)\s+)?([A-Za-z']+(?:\s+[A-Za-z']+){0,3})/g;
  var mm;
  while((mm=simRe.exec(body))!==null && similes.length<4){
    var lead=mm[1].trim().split(/\s+/).slice(-4).join(' ');
    similes.push((lead?lead+' ':'')+mm[2]+' '+(mm[3]||'')+mm[4]);
  }

  /* sentence & syntax */
  var sentences=(body.match(/[^.!?]+[.!?]+/g)||(body.trim()?[body.trim()]:[]));
  var sentLens=sentences.map(function(s){ return tokenize(s).length; }).filter(function(x){ return x>0; });
  var avgSent=sentLens.length?sentLens.reduce(function(a,b){ return a+b; },0)/sentLens.length:wc;
  var shortest=sentLens.length?Math.min.apply(null,sentLens):0;
  var longest=sentLens.length?Math.max.apply(null,sentLens):0;

  var lineWordCounts=lines.map(function(l){ return tokenize(l).length; });
  var lineVar=0;
  if(lineWordCounts.length){
    var mu=lineWordCounts.reduce(function(a,b){ return a+b; },0)/lineWordCounts.length;
    lineVar=Math.sqrt(lineWordCounts.reduce(function(a,b){ return a+(b-mu)*(b-mu); },0)/lineWordCounts.length);
  }

  var punct={
    comma:(body.match(/,/g)||[]).length,
    dash:(body.match(/—|–|--/g)||[]).length,
    question:(body.match(/\?/g)||[]).length,
    exclaim:(body.match(/!/g)||[]).length,
    semicolon:(body.match(/;/g)||[]).length
  };

  return {
    lineCount:lines.length, stanzaCount:stanzas.length, wordCount:wc,
    uniqueCount:uniqueCount, richness:wc?uniqueCount/wc:0,
    keys:keys, fields:fields, form:form,
    repeatedPhrases:repeatedPhrases, allit:allit, assonance:assonance,
    enjambRatio:enjambRatio, enjambExamples:enjambExamples, similes:similes,
    sentenceCount:sentences.length, avgSent:avgSent, shortestSent:shortest, longestSent:longest,
    lineWordCounts:lineWordCounts, lineVar:lineVar, punct:punct,
    avgWordsPerLine:lines.length?wc/lines.length:0
  };
}

var _analysisCache={};
function analysisFor(p){
  var key=p.id+':'+simpleHash(p.body+'|'+p.title);
  if(!_analysisCache[key]) _analysisCache[key]=analyzePoem(p.body,p.title);
  return _analysisCache[key];
}
function formOf(p){ return analysisFor(p).form.form; }

/* ================= READING NOTES: prose ================= */
function noteSec(label,figure,unit,bodyHtml){
  return '<section class="note-sec">'+
    '<div class="note-sec-label"><span class="label">'+esc(label)+'</span>'+
      (figure!=null ? '<div class="note-figure">'+figure+(unit?'<span class="note-figure-unit">'+esc(unit)+'</span>':'')+'</div>' : '')+
    '</div>'+
    '<div class="note-body">'+bodyHtml+'</div>'+
  '</section>';
}
function quoteBlock(text,src){
  return '<div class="quote">'+esc(text)+(src?'<span class="quote-src">'+esc(src)+'</span>':'')+'</div>';
}
function lexiconHtml(keys){
  var top=keys.slice(0,18);
  if(!top.length) return '<p>Not enough content words yet to build an index.</p>';
  var max=top[0].count;
  return '<div class="lexicon">'+top.map(function(k){
    var tier = k.count>=max*0.85 ? 1 : k.count>=max*0.6 ? 2 : k.count>=max*0.35 ? 3 : 4;
    return '<span class="lex-word lex-'+tier+'">'+esc(k.word)+(k.count>1?'<span class="c">'+k.count+'</span>':'')+'</span>';
  }).join('')+'</div>';
}
function fieldBarsHtml(fields){
  var live=fields.filter(function(f){ return f.count>0; }).slice(0,6);
  if(!live.length) return '';
  var max=live[0].count;
  return '<div class="field-bars">'+live.map(function(f){
    return '<div class="field-bar"><span class="fname">'+esc(f.name)+'</span>'+
      '<span class="ftrack"><span class="ffill" style="width:'+Math.round((f.count/max)*100)+'%"></span></span>'+
      '<span class="fcount">'+f.count+'</span></div>';
  }).join('')+'</div>';
}

function proseDiction(a){
  var k=a.keys;
  if(!k.length) return '<p>The poem is too short to show a pattern of returning words.</p>';
  var repeated=k.filter(function(x){ return x.count>1; });
  var lead=k.slice(0,3).map(function(x){ return '<em>'+esc(x.word)+'</em>'; });
  var p1='The poem\'s weight sits on '+listJoin(lead)+'.';
  if(repeated.length){
    var r=repeated.slice(0,3).map(function(x){ return '<em>'+esc(x.word)+'</em> ('+x.count+'×)'; });
    p1+=' '+cap(listJoin(r))+' come back more than once, which in a poem this length is a choice rather than an accident.';
  } else {
    p1+=' Nothing repeats — every content word is spent exactly once, so the poem never leans on a refrain.';
  }
  var p2='';
  var richPct=Math.round(a.richness*100);
  if(richPct>=72) p2='<p>Vocabulary is wide: '+richPct+'% of the words appear only once. The poem keeps reaching for a new word rather than circling one.</p>';
  else if(richPct<=55) p2='<p>Vocabulary is deliberately narrow — only '+richPct+'% of the words are unique. The poem works by return, saying the same few things until they change meaning.</p>';
  else p2='<p>At '+richPct+'% unique words, the diction is balanced: enough repetition to hold a shape, enough variety to keep moving.</p>';
  var p3='';
  if(a.repeatedPhrases.length){
    p3='<p>Whole phrases recur too — '+listJoin(a.repeatedPhrases.map(function(x){ return '<em>'+esc(x.phrase)+'</em> ('+x.count+'×)'; }))+'.</p>';
  }
  return '<p>'+p1+'</p>'+p2+p3;
}
function proseImage(a){
  var live=a.fields.filter(function(f){ return f.count>0; });
  if(!live.length) return '<p>The poem works in statement rather than image — no strong cluster of sensory or concrete words.</p>';
  var top=live[0], second=live[1];
  var s='<p>The poem\'s imagination runs strongest through <b>'+esc(top.name).toLowerCase()+'</b> — '+
    listJoin(top.examples.map(function(w){ return '<em>'+esc(w)+'</em>'; }))+'.';
  if(second && second.count>=Math.max(2,top.count*0.5)){
    s+=' Close behind sits <b>'+esc(second.name).toLowerCase()+'</b> ('+listJoin(second.examples.slice(0,3).map(function(w){ return '<em>'+esc(w)+'</em>'; }))+'), and the poem gets much of its charge from holding those two together.';
  } else if(second){
    s+=' Everything else is secondary; the poem commits to one register and stays in it.';
  }
  s+='</p>';
  return s;
}
function proseSound(a){
  var out='';
  var f=a.form;
  if(f.rhymeDensity>=0.5) out+='<p>Rhyme is doing real structural work here — about '+Math.round(f.rhymeDensity*100)+'% of the line endings chime, in the pattern '+listJoin(f.schemes.slice(0,3).map(function(s){ return '<b>'+esc(s)+'</b>'; }))+'.</p>';
  else if(f.rhymeDensity>=0.2) out+='<p>Rhyme comes and goes — roughly '+Math.round(f.rhymeDensity*100)+'% of endings answer each other, enough to feel the pull without locking the poem into a pattern.</p>';
  else out+='<p>The poem declines end rhyme almost entirely, so its music has to come from inside the line.</p>';

  if(a.allit.length){
    var ex=a.allit[0];
    out+='<p>It comes largely from consonants: '+a.allit.length+' of the '+a.lineCount+' lines pair neighbouring words on the same opening sound, as in <em>'+esc(ex.words[0])+' / '+esc(ex.words[1])+'</em>.</p>';
    out+=quoteBlock(ex.line,'alliteration on “'+ex.sound+'”');
  }
  if(a.assonance.length){
    var as=a.assonance[0];
    out+='<p>Vowels echo as well — <em>'+esc(as.words[0])+'</em> and <em>'+esc(as.words[1])+'</em> share their sound, which slows the line down as you say it.</p>';
  }
  if(!a.allit.length && !a.assonance.length) out+='<p>Sound repetition is sparse; the poem trusts its plain statement to carry it.</p>';
  return out;
}
function proseLine(a){
  var pct=Math.round(a.enjambRatio*100);
  var out='';
  if(pct>=60) out+='<p>The poem runs over its own line endings — '+pct+'% of lines break mid-thought. Sense keeps outpacing the line, which is what gives the poem its forward lean.</p>';
  else if(pct<=25) out+='<p>Lines mostly close where the sense closes ('+(100-pct)+'% end-stopped), so the poem moves in measured, self-contained units.</p>';
  else out+='<p>The poem alternates: '+pct+'% of lines spill into the next, the rest come to rest. That mix keeps the rhythm from settling into a single gait.</p>';
  if(a.enjambExamples.length) out+=quoteBlock(a.enjambExamples[0],'the line breaks before the thought does');
  if(a.lineVar>=3.2) out+='<p>Line lengths vary widely (from '+Math.min.apply(null,a.lineWordCounts)+' to '+Math.max.apply(null,a.lineWordCounts)+' words), so the shape on the page is irregular and the pacing shifts as you read.</p>';
  else out+='<p>Line lengths stay close to '+Math.round(a.avgWordsPerLine)+' words, giving the poem an even column on the page.</p>';
  return out;
}
function proseSyntax(a){
  var out='<p>Across '+a.sentenceCount+' sentence'+(a.sentenceCount===1?'':'s')+', the average runs '+Math.round(a.avgSent)+' words';
  if(a.longestSent>a.shortestSent*2.5 && a.shortestSent>0)
    out+=', but the range is wide — from '+a.shortestSent+' words to '+a.longestSent+'. Short sentences land like statements; the long ones let the poem think aloud.';
  else out+=', held fairly steady, so no single sentence dominates the poem.';
  out+='</p>';
  var marks=[];
  if(a.punct.dash>=2) marks.push('the dash ('+a.punct.dash+'×), which interrupts rather than concludes');
  if(a.punct.comma>=6) marks.push('the comma ('+a.punct.comma+'×), keeping clauses accumulating');
  if(a.punct.question>=1) marks.push('the question mark ('+a.punct.question+'×)');
  if(a.punct.semicolon>=1) marks.push('the semicolon ('+a.punct.semicolon+'×), a formal join');
  if(marks.length) out+='<p>Its habits of punctuation lean on '+listJoin(marks)+'.</p>';
  if(a.form.maxAnaphora>=2) out+='<p>“'+esc(cap(a.form.anaWord))+'” opens '+a.form.maxAnaphora+' of the lines — a small repeating hinge the poem swings on.</p>';
  return out;
}
function proseFigures(a){
  if(!a.similes.length) return '<p>No explicit comparisons. The poem states its images directly instead of saying one thing is like another — which tends to read as plainer and more certain.</p>';
  var out='<p>The poem reaches for comparison '+a.similes.length+' time'+(a.similes.length===1?'':'s')+', using <em>like</em> or <em>as</em> to put two unlike things beside each other:</p>';
  a.similes.slice(0,3).forEach(function(s){ out+=quoteBlock('… '+s+' …',''); });
  return out;
}

function readingNotesHtml(p){
  var a=analysisFor(p);
  var f=a.form;
  var formBody='<p>This reads as <b>'+esc(f.form)+'</b>, in '+esc(f.structure)+'. '+f.evidence+'</p>';
  if(f.form==='Ode') formBody+='<p>An ode holds still and looks hard at one subject, praising it without apology. Its risk is sentimentality; its reward is attention — and attention is mostly what the form is made of.</p>';
  else if(f.form==='Elegy') formBody+='<p>An elegy moves through loss toward some kind of consolation, even a reluctant one. Watch where the poem turns — that turn is usually the whole argument.</p>';
  else if(f.form==='Free verse') formBody+='<p>Free verse has to earn its shape line by line, since no inherited pattern is holding it up. The line breaks are the form.</p>';
  else if(f.form==='Catalogue') formBody+='<p>A catalogue poem builds meaning by accumulation — the list itself is the argument, and the last item carries the most weight.</p>';

  return '<div class="notes" id="reading-notes">'+
    '<div class="notes-masthead"><div>'+
      '<span class="label label-ai">Reading notes</span>'+
      '<h2>'+esc(p.title)+'</h2>'+
      '<p class="notes-standfirst">A close reading of the poem\'s form, diction, imagery, sound and syntax — with the lines that show it.</p>'+
    '</div></div>'+
    noteSec('Form','<span style="font-size:1.15rem">'+esc(f.form)+'</span>',f.structure,formBody)+
    noteSec('Diction',a.keys.length?a.keys.length:'0','distinct key words',lexiconHtml(a.keys)+proseDiction(a))+
    noteSec('Imagery',a.fields.reduce(function(s,f){ return s+f.count; },0),'image words',proseImage(a)+fieldBarsHtml(a.fields))+
    noteSec('Sound',Math.round(f.rhymeDensity*100)+'<span style="font-size:1rem">%</span>','endings rhymed',proseSound(a))+
    noteSec('The line',a.lineCount,'lines',proseLine(a))+
    noteSec('Syntax',Math.round(a.avgSent),'words / sentence',proseSyntax(a))+
    noteSec('Figures',a.similes.length,'comparisons',proseFigures(a))+
    '<p class="caveat">These notes are produced by pattern-matching — counting sounds, syllables, line endings and word families. They can tell you what the poem does; they can\'t tell you whether it works. That judgement stays with the reader.</p>'+
  '</div>';
}
