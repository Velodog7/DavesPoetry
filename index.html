/* ================= PERSISTENCE =================
   The same page runs in two places and saves differently in each:
     artifact  hosted on claude.ai — republishes itself with the state inline
     api       deployed alongside the REST API — reads and writes over HTTP
     preview   opened as a plain file — reads the built-in poems, saves nothing
*/
var API_BASE=(function(){
  try{
    var m=document.querySelector('meta[name="poems-api"]');
    if(m&&m.content) return m.content.replace(/\/+$/,'');
  }catch(e){}
  return '/api';
})();
var backend={ mode:'preview', token:null, storage:null, tokenConfigured:false,
              accountConfigured:false, authorName:null, warned:false };

function loadToken(){ try{ return localStorage.getItem('dv_token')||null; }catch(e){ return null; } }
function saveToken(t){ try{ t?localStorage.setItem('dv_token',t):localStorage.removeItem('dv_token'); }catch(e){} }

/* The first paint happens before the server has answered, so the title it
   shows is a guess — and a wrong guess is worse than a slow one: the reader
   watches the name change under them. Remember what the server last said and
   open with that instead. Written only in API mode, so nothing else sees it. */
function cacheSite(site){
  try{ localStorage.setItem('dv_site',JSON.stringify({name:site.name,byline:site.byline})); }catch(e){}
}
function applyCachedSite(){
  try{
    var raw=localStorage.getItem('dv_site'); if(!raw) return;
    var s=JSON.parse(raw);
    if(s&&s.name){ state.site.name=s.name; state.site.byline=s.byline||''; }
  }catch(e){}
}

async function apiFetch(path,opts){
  opts=opts||{};
  var headers=Object.assign({'X-Visitor-Id':visitorId},opts.headers||{});
  if(opts.body!==undefined) headers['Content-Type']='application/json';
  if(opts.auth&&backend.token) headers['Authorization']='Bearer '+backend.token;
  var res=await fetch(API_BASE+path,{
    method:opts.method||'GET', headers:headers,
    body:opts.body!==undefined?JSON.stringify(opts.body):undefined,
    cache:'no-store'
  });
  var data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    var err=new Error((data&&data.message)||('Request failed ('+res.status+')'));
    err.code=(data&&data.error)||('http_'+res.status);
    err.status=res.status;
    if(data&&data.retryAfter) err.retryAfter=data.retryAfter;
    if(data&&typeof data.attemptsRemaining==='number') err.attemptsRemaining=data.attemptsRemaining;
    throw err;
  }
  return data;
}

/* The API reports a like count plus whether this reader is among them; the UI
   works from a list, so rebuild one of the right length. */
function poemFromApi(p){
  var likedBy=[];
  for(var i=0;i<p.likes;i++) likedBy.push('reader-'+i);
  if(p.likedByMe){ if(likedBy.length) likedBy[0]=visitorId; else likedBy.push(visitorId); }
  return {
    id:p.id, title:p.title, date:p.date, tags:(p.tags||[]).slice(), body:p.body, blurb:p.blurb||'',
    style:Object.assign(defaultPoemStyle(),p.style||{}),
    highlights:Array.isArray(p.highlights)?p.highlights.slice():[],
    likedBy:likedBy,
    comments:(p.comments||[]).map(function(c){ return {id:c.id,name:c.name,text:c.text,ts:c.createdAt}; }),
    sample:!!p.sample
  };
}
function apiPoemPayload(p){
  return { title:p.title, body:p.body, blurb:p.blurb||'', date:p.date,
           tags:p.tags.slice(), style:p.style, highlights:highlightsOf(p) };
}
async function loadFromApi(){
  var site=await apiFetch('/site');
  var list=await apiFetch('/poems?sort=newest');
  if(site){
    state.site.name=site.name||state.site.name;
    state.site.byline=site.byline||'';
    cacheSite(state.site);                 /* so the next load opens correctly */
  }
  state.poems=(list.poems||[]).map(poemFromApi);
  _analysisCache={};
}
async function initBackend(){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      artifactAPI=await window.claude.use('artifact');
      if(artifactAPI){ backend.mode='artifact'; return; }
    }
  }catch(e){ artifactAPI=null; }
  try{
    var h=await apiFetch('/health');
    if(h&&h.status==='ok'){
      backend.mode='api';
      backend.storage=h.storage||null;
      backend.tokenConfigured=!!h.authorTokenConfigured;
      backend.accountConfigured=!!h.authorAccountConfigured;
      if(backend.storage&&backend.storage.writable===false) writable=false;
      /* A saved session can have expired or been revoked from another device.
         Ask the server rather than trusting what is in local storage. */
      backend.token=loadToken();
      if(backend.token){
        try{
          var who=await apiFetch('/auth/session',{auth:true});
          if(who&&who.valid){ runtime.authorMode=true; backend.authorName=who.name||null; }
          else { backend.token=null; saveToken(null); }
        }catch(e){ backend.token=null; saveToken(null); }
      }
      await loadFromApi();
      return;
    }
  }catch(e){}
  backend.mode='preview';
}
function handleApiError(err){
  var c=err&&err.code;
  if(err&&err.status===401){
    backend.token=null; saveToken(null); runtime.authorMode=false;
    showToast('Your session has ended — sign in again');
  } else if(c==='read_only'){
    writable=false;
    showToast('Nothing is saved yet — connect a KV store');
  } else if(c==='no_author_token'){
    showToast('The server has no author token set');
  } else {
    showToast((err&&err.message)||'Could not save — please try again');
  }
}
async function apiPersist(op){
  op=op||{kind:'all'};
  try{
    if(op.kind==='like'){
      await apiFetch('/poems/'+op.id+'/likes',{method:op.liked?'POST':'DELETE',body:{visitorId:visitorId}});
    } else if(op.kind==='comment:add'){
      var made=await apiFetch('/poems/'+op.id+'/comments',{method:'POST',body:{name:op.name,text:op.text}});
      var p=poemById(op.id);
      if(p&&p.comments.length&&made&&made.id) p.comments[p.comments.length-1].id=made.id;
    } else if(op.kind==='comment:delete'){
      await apiFetch('/poems/'+op.id+'/comments/'+op.commentId,{method:'DELETE',auth:true});
    } else if(op.kind==='poem:create'){
      var poem=poemById(op.id);
      var created=await apiFetch('/poems',{method:'POST',auth:true,body:apiPoemPayload(poem)});
      if(poem&&created&&created.id) poem.id=created.id;   /* adopt the server's id */
      _analysisCache={};
    } else if(op.kind==='poem:update'){
      await apiFetch('/poems/'+op.id,{method:'PATCH',auth:true,body:apiPoemPayload(poemById(op.id))});
    } else if(op.kind==='poem:delete'){
      await apiFetch('/poems/'+op.id,{method:'DELETE',auth:true});
    } else if(op.kind==='highlights'){
      await apiFetch('/poems/'+op.id+'/highlights',{method:'PUT',auth:true,body:{indices:op.indices}});
    } else if(op.kind==='site'){
      await apiFetch('/site',{method:'PATCH',auth:true,body:{name:state.site.name,byline:state.site.byline}});
    } else {
      await apiFetch('/import',{method:'POST',auth:true,body:{site:state.site,poems:state.poems}});
    }
  }catch(err){
    handleApiError(err);
    /* The optimistic change may not have landed — take the server's word for it. */
    try{ await loadFromApi(); render(); }catch(e){}
  }
}
/* Capture our own head assets at load time. We must NOT use document.head.innerHTML:
   the artifact shell serves this file inside <body>, so the stylesheet and font links
   live in the body, and copying the head alone would republish the page with no CSS. */
var STATIC_HEAD=(function(){
  var out='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">';
  var t=document.querySelector('title');
  out+='<title>'+((t&&t.textContent)||"Multitudes of Dave: Selected Poems")+'</title>';
  var links=document.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"]');
  for(var i=0;i<links.length;i++) out+=links[i].outerHTML;
  var css=document.getElementById('app-styles');
  if(css) out+=css.outerHTML;
  return out;
})();
var STATIC_SCRIPT=(function(){ var s=document.getElementById('app-script'); return s?s.outerHTML:''; })();

function buildFullPage(){
  if(!STATIC_SCRIPT || STATIC_HEAD.indexOf('app-styles')<0){
    throw {code:'invalid_content', message:'page assets missing'};
  }
  return '<!doctype html><html lang="en"><head>'+STATIC_HEAD+'</head><body>'+
    '<div id="app"><header class="masthead"><div class="masthead-inner" id="masthead-inner"></div></header>'+
    '<main id="main-view"></main><footer class="sitefoot" id="sitefoot"></footer></div>'+
    '<div id="overlay-root"><div id="modal-root"></div><div class="toast-stack" id="toast-stack"></div></div>'+
    '<script type="application/json" id="app-data">'+safeJSON(state)+'<\/script>'+
    STATIC_SCRIPT+'</body></html>';
}
async function artifactPublish(){
  if(!artifactAPI) return;
  try{ await artifactAPI.publish(buildFullPage()); }
  catch(err){
    var c=err&&err.code;
    if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'){
      if(writable){ writable=false; render(); showToast('Read-only copy — changes are not saved'); }
    } else if(c!=='conflict'){ showToast('Could not save — please try again'); }
  }
}
async function persist(op){
  if(backend.mode==='artifact') return artifactPublish();
  if(backend.mode==='api') return apiPersist(op);
  if(!backend.warned){ backend.warned=true; showToast('Preview — changes are not saved'); }
}

/* ================= A11Y & CHROME ================= */
function applyPrefs(){
  try{
    var s=localStorage.getItem('dv_step'); if(s) document.documentElement.style.setProperty('--step',s);
    var t=localStorage.getItem('dv_theme'); if(t) document.documentElement.setAttribute('data-theme',t);
    var c=localStorage.getItem('dv_contrast'); if(c==='high') document.documentElement.setAttribute('data-contrast','high');
    var m=localStorage.getItem('dv_motion'); if(m==='off'){ document.documentElement.setAttribute('data-motion','off'); runtime.motionOff=true; }
  }catch(e){}
}
function stepIndex(){
  var cur=parseFloat(document.documentElement.style.getPropertyValue('--step'))||1;
  var idx=1,best=Infinity;
  STEP_VALUES.forEach(function(v,i){ var d=Math.abs(v-cur); if(d<best){ best=d; idx=i; } });
  return idx;
}
function stepText(dir){
  var v=STEP_VALUES[clamp(stepIndex()+dir,0,STEP_VALUES.length-1)];
  document.documentElement.style.setProperty('--step',v);
  saveLocal('dv_step',String(v)); renderMasthead();
}
function toggleContrast(){
  var on=document.documentElement.getAttribute('data-contrast')==='high';
  if(on){ document.documentElement.removeAttribute('data-contrast'); saveLocal('dv_contrast',''); }
  else { document.documentElement.setAttribute('data-contrast','high'); saveLocal('dv_contrast','high'); }
  renderMasthead();
}
function toggleMotion(){
  var on=document.documentElement.getAttribute('data-motion')==='off';
  if(on){ document.documentElement.removeAttribute('data-motion'); saveLocal('dv_motion',''); runtime.motionOff=false; }
  else { document.documentElement.setAttribute('data-motion','off'); saveLocal('dv_motion','off'); runtime.motionOff=true; }
  renderMasthead();
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var dark=cur==='dark'||(!cur&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var next=dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next); saveLocal('dv_theme',next); renderMasthead();
}
function showToast(msg){
  var st=document.getElementById('toast-stack'); if(!st) return;
  var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  st.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity 240ms ease'; t.style.opacity='0'; setTimeout(function(){ t.remove(); },260); },2600);
}
function a11yPopover(){
  var i=stepIndex();
  var ch=document.documentElement.getAttribute('data-contrast')==='high';
  var mo=document.documentElement.getAttribute('data-motion')==='off';
  return '<div class="popover" role="dialog" aria-label="Reading settings">'+
    '<span class="label">Reading settings</span>'+
    '<div class="a11y-row"><div><div class="a11y-row-label">Text size</div><div class="a11y-row-desc">Scales the whole site</div></div>'+
      '<div class="stepper"><button type="button" data-action="a11y-step" data-dir="-1" aria-label="Smaller text">−</button>'+
      '<span>'+Math.round(STEP_VALUES[i]*100)+'%</span>'+
      '<button type="button" data-action="a11y-step" data-dir="1" aria-label="Larger text">+</button></div></div>'+
    '<div class="a11y-row"><div><div class="a11y-row-label">High contrast</div><div class="a11y-row-desc">Stronger text and rules</div></div>'+
      '<button type="button" class="switch" role="switch" aria-checked="'+ch+'" data-action="a11y-contrast" aria-label="Toggle high contrast"></button></div>'+
    '<div class="a11y-row"><div><div class="a11y-row-label">Reduce motion</div><div class="a11y-row-desc">Turns off animation</div></div>'+
      '<button type="button" class="switch" role="switch" aria-checked="'+mo+'" data-action="a11y-motion" aria-label="Toggle reduced motion"></button></div>'+
  '</div>';
}

/* ================= LIBRARY / INDEX ================= */
function allTags(){
  var s={}; state.poems.forEach(function(p){ p.tags.forEach(function(t){ s[t]=1; }); });
  return Object.keys(s).sort();
}
function allForms(){
  var s={}; state.poems.forEach(function(p){ s[formOf(p)]=(s[formOf(p)]||0)+1; });
  return Object.keys(s).sort(function(a,b){ return s[b]-s[a]||a.localeCompare(b); });
}
function filteredPoems(){
  var list=state.poems.slice();
  var q=(runtime.query||'').trim().toLowerCase();
  if(q) list=list.filter(function(p){
    return p.title.toLowerCase().indexOf(q)>=0 || p.body.toLowerCase().indexOf(q)>=0 ||
      p.tags.some(function(t){ return t.toLowerCase().indexOf(q)>=0; }) ||
      formOf(p).toLowerCase().indexOf(q)>=0;
  });
  if(runtime.activeTags.size) list=list.filter(function(p){ return p.tags.some(function(t){ return runtime.activeTags.has(t); }); });
  if(runtime.activeForms.size) list=list.filter(function(p){ return runtime.activeForms.has(formOf(p)); });
  if(runtime.sort==='oldest') list.sort(function(a,b){ return a.date.localeCompare(b.date); });
  else if(runtime.sort==='title') list.sort(function(a,b){ return a.title.localeCompare(b.title); });
  else if(runtime.sort==='liked') list.sort(function(a,b){ return likeCount(b)-likeCount(a); });
  else if(runtime.sort==='form') list.sort(function(a,b){ return formOf(a).localeCompare(formOf(b))||b.date.localeCompare(a.date); });
  else list.sort(function(a,b){ return b.date.localeCompare(a.date); });
  return list;
}

/* ================= COLLECTION ================= */
function trendSvg(data,suffix){
  if(data.length<2) return '<p class="trend-read">Two or more poems are needed before a trend means anything.</p>';
  var w=460,h=110,pad=14;
  var vals=data.map(function(d){ return d.value; });
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), range=(max-min)||1;
  var stepX=(w-pad*2)/(data.length-1);
  var pts=data.map(function(d,i){ return { x:pad+i*stepX, y:pad+(h-pad*2)*(1-(d.value-min)/range), d:d }; });
  var line=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' ');
  var area=line+' L'+pts[pts.length-1].x.toFixed(1)+' '+(h-pad)+' L'+pts[0].x.toFixed(1)+' '+(h-pad)+' Z';
  var dots=pts.map(function(p,i){
    var end=i===pts.length-1;
    return '<circle class="tdot'+(end?' end':'')+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(end?3.6:2.6)+'">'+
      '<title>'+esc(p.d.label)+' — '+p.d.value+suffix+'</title></circle>';
  }).join('');
  var first=vals[0],last=vals[vals.length-1];
  var dir=last>first*1.08?'rising':last<first*0.92?'falling':'steady';
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+dir+' across the collection">'+
    '<line class="tbase" x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'"/>'+
    '<path class="tarea" d="'+area+'"/>'+
    '<path class="tline" d="'+line+'"/>'+dots+
    '<text x="'+pad+'" y="'+(h-3)+'">'+fmtTiny(data[0].date)+'</text>'+
    '<text x="'+(w-pad)+'" y="'+(h-3)+'" text-anchor="end">'+fmtTiny(data[data.length-1].date)+'</text></svg>'+
    '<p class="trend-read">'+cap(dir)+' — from '+first+suffix+' to '+last+suffix+'.</p>';
}
function renderCollection(){
  var main=document.getElementById('main-view');
  var poems=state.poems.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!poems.length){
    main.innerHTML='<div class="view"><div class="empty-state"><h3>Nothing to read yet</h3><p>Once there are a few poems, the patterns across them appear here.</p></div></div>';
    return;
  }
  var A=poems.map(function(p){ return {p:p,a:analysisFor(p)}; });
  var totalWords=0; A.forEach(function(x){ totalWords+=x.a.wordCount; });

  /* collection lexicon — distinctive key words weighted across poems */
  var agg={};
  A.forEach(function(x){
    x.a.keys.forEach(function(k){
      if(!agg[k.stem]) agg[k.stem]={word:k.word,count:0,poems:{},light:k.light};
      agg[k.stem].count+=k.count;
      agg[k.stem].poems[x.p.title]=1;
      if(k.word.length<agg[k.stem].word.length) agg[k.stem].word=k.word;
    });
  });
  var minSpread=poems.length>=3?2:1;
  var lexicon=Object.keys(agg).map(function(s){
    var g=agg[s], spread=Object.keys(g.poems).length;
    return { word:g.word, count:g.count, spread:spread, poems:Object.keys(g.poems),
      score:g.count*(g.light?0.3:1)*(1+spread*0.8) };
  }).filter(function(x){ return x.spread>=minSpread && x.count>1; })
    .sort(function(a,b){ return b.score-a.score; }).slice(0,12);

  /* forms */
  var formTally={};
  A.forEach(function(x){ var f=x.a.form.form; formTally[f]=(formTally[f]||0)+1; });
  var formRows=Object.keys(formTally).map(function(f){ return [f,formTally[f]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var formMax=formRows[0][1];

  /* image fields across collection */
  var fieldTotals={};
  IMAGE_FIELDS.forEach(function(f){ fieldTotals[f.key]={name:f.name,count:0}; });
  A.forEach(function(x){ x.a.fields.forEach(function(f){ fieldTotals[f.key].count+=f.count; }); });
  var fieldRank=Object.keys(fieldTotals).map(function(k){ return fieldTotals[k]; })
    .filter(function(f){ return f.count>0; }).sort(function(a,b){ return b.count-a.count; });

  var vocab={}; A.forEach(function(x){ tokenize(x.p.body).forEach(function(w){ vocab[w]=1; }); });

  var lenTrend=A.map(function(x){ return {date:x.p.date,label:x.p.title,value:x.a.wordCount}; });
  var richTrend=A.map(function(x){ return {date:x.p.date,label:x.p.title,value:Math.round(x.a.richness*100)}; });
  var imgTrend=A.map(function(x){
    var tot=0; x.a.fields.forEach(function(f){ tot+=f.count; });
    return {date:x.p.date,label:x.p.title,value:x.a.wordCount?Math.round((tot/x.a.wordCount)*100):0};
  });
  var rhymeTrend=A.map(function(x){ return {date:x.p.date,label:x.p.title,value:Math.round(x.a.form.rhymeDensity*100)}; });

  var dominantForm=formRows[0][0];
  var formShare=Math.round((formRows[0][1]/poems.length)*100);
  var takesArticle=['Ode','Elegy','Sonnet','Ballad','Haiku','Tanka','Villanelle','Limerick','Lyric','Catalogue'].indexOf(dominantForm)>=0;
  var domPhrase=(takesArticle?'the ':'')+dominantForm.toLowerCase();
  var openingObs='<p>Across '+poems.length+' poems written between '+fmtShort(poems[0].date)+' and '+fmtShort(poems[poems.length-1].date)+
    ', the work returns most often to <b>'+esc(domPhrase)+'</b> — '+formRows[0][1]+' of '+poems.length+' poems, or '+formShare+'%.</p>';
  if(formRows.length>1) openingObs+='<p>Alongside it sit '+listJoin(formRows.slice(1,4).map(function(r){ return formCountPhrase(r[0],r[1]); }))+'.</p>';
  if(fieldRank.length) openingObs+='<p>Its imagination is grounded in <b>'+esc(fieldRank[0].name.toLowerCase())+'</b>'+
    (fieldRank[1]?' and <b>'+esc(fieldRank[1].name.toLowerCase())+'</b>':'')+
    ', and the words that travel furthest between poems are '+listJoin(lexicon.slice(0,3).map(function(l){ return '<em>'+esc(l.word)+'</em>'; }))+'.</p>';

  main.innerHTML=
    '<div class="view">'+
      '<div class="coll-head">'+
        '<span class="label label-ai">The Collection</span>'+
        '<h1 class="coll-title">Reading the whole body of work</h1>'+
        '<p class="coll-standfirst">What the poems share when you set them side by side — the forms returned to, the words that travel between them, and how the writing has shifted over time.</p>'+
      '</div>'+
      '<div class="coll-figures">'+
        '<div class="coll-fig"><span class="n">'+pad2(poems.length)+'</span><span class="label">poems</span></div>'+
        '<div class="coll-fig"><span class="n">'+Object.keys(vocab).length+'</span><span class="label">distinct words</span></div>'+
        '<div class="coll-fig"><span class="n">'+formRows.length+'</span><span class="label">forms used</span></div>'+
        '<div class="coll-fig"><span class="n">'+Math.round(totalWords/poems.length)+'</span><span class="label">words per poem</span></div>'+
      '</div>'+

      '<section class="coll-sec"><div class="coll-sec-label"><span class="label">Observations</span></div>'+
        '<div class="coll-sec-body">'+openingObs+'</div></section>'+

      '<section class="coll-sec"><div class="coll-sec-label"><span class="label">Forms</span></div>'+
        '<div class="coll-sec-body"><div class="form-list">'+
        formRows.map(function(r){
          return '<div class="form-row"><span class="fname">'+esc(r[0])+'</span>'+
            '<span class="ftrack"><span class="ffill" style="width:'+Math.round((r[1]/formMax)*100)+'%"></span></span>'+
            '<span class="fcount">'+r[1]+'</span></div>';
        }).join('')+
        '</div></div></section>'+

      '<section class="coll-sec"><div class="coll-sec-label"><span class="label">Lexicon</span></div>'+
        '<div class="coll-sec-body"><p style="margin-bottom:20px">Words that recur across more than one poem — the vocabulary the work keeps coming back to.</p>'+
        '<div class="lex-collection">'+
        (lexicon.length?lexicon.map(function(l){
          return '<div class="lex-row"><span class="w">'+esc(l.word)+'<span class="c">'+l.count+'</span></span>'+
            '<span class="where">'+esc(l.poems.slice(0,3).join(' · '))+(l.poems.length>3?' and '+(l.poems.length-3)+' more':'')+'</span></div>';
        }).join(''):'<p>Not enough repetition yet to build a lexicon.</p>')+
        '</div></div></section>'+

      '<section class="coll-sec"><div class="coll-sec-label"><span class="label">Imagery</span></div>'+
        '<div class="coll-sec-body">'+fieldBarsHtml(fieldRank.map(function(f){ return {name:f.name,count:f.count}; }))+'</div></section>'+

      '<section class="coll-sec"><div class="coll-sec-label"><span class="label">Over time</span></div>'+
        '<div class="coll-sec-body"><div class="trend-pair">'+
          '<div class="trend"><span class="label">Length</span>'+trendSvg(lenTrend,' words')+'</div>'+
          '<div class="trend"><span class="label">Vocabulary range</span>'+trendSvg(richTrend,'%')+'</div>'+

        '</div></div></section>'+

    '</div>';

  var form=document.getElementById('poem-editor-form');
  if(!form||!runtime.draft) return;
  var fd=new FormData(form);
  runtime.draft.title=fd.get('title')||'';
  runtime.draft.date=fd.get('date')||runtime.draft.date;
  runtime.draft.tags=(fd.get('tags')||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  runtime.draft.blurb=fd.get('blurb')||'';

    runtime.picker={mode:'draft', id:null, title:d.title, body:d.body, accent:d.style.accent, indices:(d.highlights||[]).slice()};
  }

/* Repaint only the picker's word spans so a drag stays smooth. */
function refreshPicker(){
  var st=runtime.picker; if(!st) return;
  var set={}; st.indices.forEach(function(i){ set[i]=1; });
  var stage=document.getElementById('picker-verse');
  if(stage){
    var nodes=stage.querySelectorAll('.wtok');
    for(var i=0;i<nodes.length;i++){
      var on=!!set[+nodes[i].dataset.wi];
      nodes[i].classList.toggle('on',on);
      nodes[i].setAttribute('aria-pressed',on?'true':'false');
    }
  }
  var c=document.getElementById('picker-count');
  if(c) c.textContent=st.indices.length+' word'+(st.indices.length===1?'':'s')+' marked';
}
function setPickerWord(i,on){
  var st=runtime.picker; if(!st) return;
  var at=st.indices.indexOf(i);
  if(on && at<0) st.indices.push(i);
  else if(!on && at>=0) st.indices.splice(at,1);
}
function savePicker(){
  var st=runtime.picker; if(!st) return;
  var idx=st.indices.slice().sort(function(a,b){ return a-b; });
  if(st.mode==='poem'){
    var p=poemById(st.id);
    if(p){ p.highlights=idx; runtime.highlightOn=idx.length?p.id:null; }
    runtime.modal=null; runtime.picker=null;
    render(); persist({kind:'highlights',id:st.id,indices:idx});
    showToast(idx.length?'Highlights saved':'Highlights cleared');
  } else {
    runtime.draft.highlights=idx;
    runtime.picker=null;
    runtime.modal={type:'editor',id:runtime.editingId||null};
    renderOverlay();
    showToast(idx.length+' word'+(idx.length===1?'':'s')+' marked');
  }
  emit('highlights:changed',{id:st.id,indices:idx});
}
/* Pointer drag: the first word decides whether the drag adds or removes. */
var _drag=null;
function pickerPointerDown(e){
  var w=e.target.closest && e.target.closest('.wtok');
  if(!w||!runtime.picker) return;
  e.preventDefault();
  var i=+w.dataset.wi;
  _drag={add:runtime.picker.indices.indexOf(i)<0};
  setPickerWord(i,_drag.add);
  refreshPicker();
}
function pickerPointerOver(e){
  if(!_drag||!runtime.picker) return;
  var w=e.target.closest && e.target.closest('.wtok');
  if(!w) return;
  setPickerWord(+w.dataset.wi,_drag.add);
  refreshPicker();
}
function pickerPointerUp(){ _drag=null; }

/* The keypad. Digits, a backspace, and nothing else to get lost in. */
function pinPad(len,min){
  var dots='';
  for(var d=0;d<Math.max(len,min||4);d++){
    dots+='<span class="pin-dot'+(d<len?' is-filled':'')+'"></span>';
  }
  var keys='';
  for(var n=1;n<=9;n++){
    keys+='<button type="button" class="pin-key" data-action="pin-key" data-key="'+n+'" aria-label="'+n+'">'+n+'</button>';
  }
  keys+='<button type="button" class="pin-key is-quiet" data-action="pin-clear" aria-label="Clear">Clear</button>'+
        '<button type="button" class="pin-key" data-action="pin-key" data-key="0" aria-label="0">0</button>'+
        '<button type="button" class="pin-key is-quiet" data-action="pin-back" aria-label="Delete last digit"'+
          (len?'':' disabled')+'>&#9003;</button>';
  return '<div class="pin-dots" aria-hidden="true">'+dots+'</div>'+
         '<div class="pin-pad" role="group" aria-label="PIN keypad">'+keys+'</div>';
}

function renderOverlay(){
  var root=document.getElementById('modal-root'); if(!root) return;
  var h='';
  if(runtime.modal){
    if(runtime.modal.type==='editor') h=editorModal();
    else if(runtime.modal.type==='author') h=authorModal();
    else if(runtime.modal.type==='confirmDelete') h=confirmDeleteModal();
    else if(runtime.modal.type==='changePin') h=changePinModal();
    else if(runtime.modal.type==='picker') h=pickerModal();
    else if(runtime.modal.type==='rename') h=renameModal();
  }
  root.innerHTML=h;
  if(runtime.modal){ var f=root.querySelector('input,textarea,button'); if(f) f.focus(); }
}
function closeModal(){
  runtime.pin=''; runtime.pinError=''; runtime.authorSetup=false; runtime.changePin=false;
  if(runtime.modal&&runtime.modal.type==='picker'&&runtime.picker&&runtime.picker.mode==='draft'){
    runtime.picker=null;
    runtime.modal={type:'editor',id:runtime.editingId||null};
    renderOverlay();
    return;
  }
  runtime.modal=null; runtime.picker=null; renderOverlay();
}

function render(){
  renderMasthead();

  else if(runtime.view==='collection') renderCollection();
  else renderLibrary();
  renderFooter();
  renderOverlay();
}
function setView(v){
  runtime.view=v; runtime.poemId=null; render();

}
function openPoem(id){
  runtime.view='reader'; runtime.poemId=id; runtime.showNotes=null;

}
function openEditor(id){
  var ex=id?poemById(id):null;
  runtime.draft=ex?{title:ex.title,date:ex.date,tags:ex.tags.slice(),body:ex.body,blurb:ex.blurb||'',
                    style:Object.assign({},ex.style),highlights:highlightsOf(ex).slice()}
                 :{title:'',date:todayISO(),tags:[],body:'',blurb:'',style:defaultPoemStyle(),highlights:[]};
  runtime.editingId=id||null;
  runtime.modal={type:'editor',id:id||null};
  renderOverlay();
}
function stepStyle(prop,dir){
  var s=runtime.draft.style;
  if(prop==='size') s.size=clamp(round2(s.size+dir*0.06),0.9,1.8);
  else if(prop==='leading') s.leading=clamp(round2(s.leading+dir*0.1),1.3,2.4);
}
function submitEditor(e){
  e.preventDefault(); syncDraft();
  var d=runtime.draft;
  if(!d.title.trim()||!d.body.trim()) return;
  var id=runtime.modal.id, newId=null;
  if(id){
    var p=poemById(id);
    if(p) Object.assign(p,{title:d.title.trim(),date:d.date,tags:d.tags,body:d.body,blurb:(d.blurb||'').trim(),style:d.style,
      highlights:(d.highlights||[]).slice().sort(function(a,b){ return a-b; }),sample:false});
  } else {
    newId=genId();
    state.poems.push({id:newId,title:d.title.trim(),date:d.date,tags:d.tags,body:d.body,blurb:(d.blurb||'').trim(),style:d.style,
      highlights:(d.highlights||[]).slice().sort(function(a,b){ return a-b; }),sample:false,likedBy:[],comments:[]});
  }
  _analysisCache={};
  runtime.modal=null; runtime.view='library';
  render();
  persist(id?{kind:'poem:update',id:id}:{kind:'poem:create',id:newId});

function toggleLike(id){

function submitComment(e){

function setErr(id,m){ var e=document.getElementById(id); if(e) e.textContent=m; }

/* ---------------------------------------------------------- the account --- */

function lockWait(until){
  var s=Math.max(0,Math.ceil((until-Date.now())/1000));
  if(s<60) return s+' seconds';
  var m=Math.ceil(s/60);
  if(m<60) return m+(m===1?' minute':' minutes');
  var h=Math.round(m/60);
  return h+(h===1?' hour':' hours');
}
function pinPush(d){
  if(runtime.pinBusy) return;
  if(runtime.pin.length>=8) return;
  runtime.pin+=String(d); runtime.pinError='';
  renderOverlay();
}
function pinBack(){
  if(runtime.pinBusy) return;
  runtime.pin=runtime.pin.slice(0,-1); runtime.pinError='';
  renderOverlay();
}
/* The pad is for tapping; a keyboard should still work for anyone who prefers
   one. Only live while the PIN screen is the thing on screen. */
function onPinKeydown(e){
  if(!runtime.modal||runtime.modal.type!=='author') return;
  if(backend.mode!=='api'||runtime.authorMode||runtime.authorSetup) return;
  if(!backend.accountConfigured) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var t=e.target&&e.target.tagName;
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pinPush(e.key); }
  else if(e.key==='Backspace'){ e.preventDefault(); pinBack(); }
  else if(e.key==='Enter'){ e.preventDefault(); submitPin(); }
}
async function submitPin(){
  if(runtime.pinBusy||runtime.pin.length<4) return;
  runtime.pinBusy=true;
  var pin=runtime.pin;
  try{
    var out=await apiFetch('/auth/session',{method:'POST',body:{pin:pin,device:deviceLabel()}});
    backend.token=out.token; saveToken(out.token);
    backend.authorName=out.name||null; backend.accountConfigured=true;
    runtime.pin=''; runtime.pinError=''; runtime.pinLock=0;
    runtime.authorMode=true; runtime.modal=null; runtime.pinBusy=false;
    render(); showToast('Signed in'+(out.name?', '+out.name:''));
  }catch(err){
    runtime.pinBusy=false; runtime.pin='';
    if(err&&err.status===429){
      /* The server decides how long; we only display it. */
      runtime.pinLock=Date.now()+((err.retryAfter||900)*1000);
      runtime.pinError='';
    } else {
      runtime.pinError=(err&&err.message)||'That did not work.';
    }
    renderOverlay();
  }
}
function deviceLabel(){
  try{
    var ua=navigator.userAgent||'';
    if(/iPhone/.test(ua)) return 'iPhone';
    if(/iPad/.test(ua)) return 'iPad';
    if(/Android/.test(ua)) return 'Android';
    if(/Mac OS X/.test(ua)) return 'Mac';
    if(/Windows/.test(ua)) return 'Windows PC';
  }catch(e){}
  return 'a browser';
}
async function submitAuthorSetup(e){
  e.preventDefault();
  var fd=new FormData(e.target);
  var key=(fd.get('key')||'').trim();
  var pin=(fd.get('pin')||'').trim();
  var pin2=(fd.get('pin2')||'').trim();
  var name=(fd.get('name')||'').trim();
  if(pin!==pin2){ setErr('author-error','The two PINs are different.'); return; }
  var prev=backend.token;
  backend.token=key;                                   /* the setup key, used once */
  try{
    var out=await apiFetch('/auth/setup',{method:'POST',auth:true,
      body:{pin:pin,name:name,device:deviceLabel(),reset:!!runtime.authorSetup}});
    backend.token=out.token; saveToken(out.token);      /* replaced by a session immediately */
    backend.authorName=out.name||null; backend.accountConfigured=true;
    runtime.authorSetup=false; runtime.authorMode=true; runtime.modal=null;
    if(out.clearedSamples) await loadFromApi();     /* the examples are gone; re-read */
    render();
    showToast(out.reset?'PIN changed':'Account created — your PIN works from now on');
  }catch(err){
    backend.token=prev;
    setErr('author-error', err&&err.status===401
      ? 'That setup key is not right.'
      : (err&&err.message)||'Could not create the account.');
  }
}
async function submitApiChangePin(e){
  e.preventDefault();
  var fd=new FormData(e.target);
  var cur=(fd.get('currentPin')||'').trim();
  var pin=(fd.get('pin')||'').trim();
  var pin2=(fd.get('pin2')||'').trim();
  if(pin!==pin2){ setErr('author-error','The two PINs are different.'); return; }
  try{
    var out=await apiFetch('/auth/pin',{method:'POST',auth:true,
      body:{currentPin:cur,pin:pin,device:deviceLabel()}});
    backend.token=out.token; saveToken(out.token);
    runtime.changePin=false; renderOverlay();
    showToast('PIN changed — other devices are signed out');
  }catch(err){
    setErr('author-error',(err&&err.message)||'Could not change the PIN.');
  }
}
async function signOut(everywhere){
  if(backend.mode==='api'&&backend.token){
    try{ await apiFetch('/auth/session'+(everywhere?'?all=true':''),{method:'DELETE',auth:true}); }
    catch(e){}                       /* the local token goes either way */
  }
  backend.token=null; saveToken(null);
  runtime.authorMode=false; runtime.modal=null; runtime.changePin=false; runtime.pin='';
  render();
  if(everywhere) showToast('Signed out everywhere');
}

async function submitAuthorToken(e){
  e.preventDefault();
  var token=(new FormData(e.target).get('token')||'').trim();
  if(!token) return;
  var prev=backend.token;
  backend.token=token;
  try{
    await apiFetch('/export',{auth:true});      /* author-only: a valid token returns 200 */
    saveToken(token);
    runtime.authorMode=true; runtime.modal=null;
    render(); showToast('Signed in');
  }catch(err){
    backend.token=prev;
    var el=document.getElementById('author-error');
    if(el) el.textContent = err&&err.status===401 ? 'That token is not right.' : (err&&err.message)||'Could not sign in.';
  }
}
function submitAuthor(e){
  e.preventDefault();
  var has=!!state.site.pinHash, fd=new FormData(e.target), p1=fd.get('pin1')||'';
  if(!has){
    var p2=fd.get('pin2')||'';
    if(p1.length<4){ setErr('author-error','Use at least 4 characters.'); return; }
    if(p1!==p2){ setErr('author-error','The PINs do not match.'); return; }
    state.site.pinHash=simpleHash(p1); runtime.authorMode=true; runtime.modal=null;
    render(); persist({kind:'all'}); showToast('Author mode ready');
  } else {
    if(simpleHash(p1)!==state.site.pinHash){ setErr('author-error','That PIN is not right.'); return; }
    runtime.authorMode=true; runtime.modal=null; render();
  }
}

function submitChangePin(e){

function onClick(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('scrim')){ closeModal(); return; }
  if(runtime.popover && !el.closest('.popover') && !el.closest('[data-action="toggle-a11y"]')){
    runtime.popover=null; renderMasthead();
  }
  var btn=el.closest('[data-action]'); if(!btn) return;
  var a=btn.dataset.action, id=btn.dataset.id;
  switch(a){
    case 'go-view': setView(btn.dataset.view); break;
    case 'open-poem': openPoem(id); break;
    case 'toggle-like': writable?toggleLike(id):showToast('Read-only copy'); break;
    case 'toggle-tag':
      var t=btn.dataset.tag;
      runtime.activeTags.has(t)?runtime.activeTags.delete(t):runtime.activeTags.add(t);
      renderIndexList(); break;
    case 'toggle-form':
      var f=btn.dataset.form;
      runtime.activeForms.has(f)?runtime.activeForms.delete(f):runtime.activeForms.add(f);
      renderIndexList(); break;
    case 'toggle-highlights':
      runtime.highlightOn=(runtime.highlightOn===id)?null:id;
      render(); break;
    case 'open-picker': openPicker(id||null); break;
    case 'picker-clear':
      if(runtime.picker){ runtime.picker.indices=[]; refreshPicker(); }
      break;
    case 'picker-word':
      if(runtime.picker){
        var w=btn.dataset.word;
        var hits=indicesForWords(runtime.picker.body,[w]);
        var allOn=hits.every(function(i){ return runtime.picker.indices.indexOf(i)>=0; });
        hits.forEach(function(i){ setPickerWord(i,!allOn); });
        refreshPicker();
      }
      break;
    case 'picker-save': savePicker(); break;
    case 'toggle-notes':
      runtime.showNotes=(runtime.showNotes===id)?null:id;
      render();
      if(runtime.showNotes){
        requestAnimationFrame(function(){
          var n=document.getElementById('reading-notes');
          if(n) n.scrollIntoView({behavior:runtime.motionOff?'auto':'smooth',block:'start'});
        });
      }
      break;
    case 'open-editor': openEditor(id||null); break;
    case 'delete-poem': runtime.modal={type:'confirmDelete',id:id}; renderOverlay(); break;
    case 'confirm-delete': confirmDelete(id); break;
    case 'delete-comment': deleteComment(id,btn.dataset.cid); break;
    case 'close-modal': closeModal(); break;
    case 'set-style': syncDraft(); runtime.draft.style[btn.dataset.prop]=btn.dataset.val; renderOverlay(); break;
    case 'style-step': syncDraft(); stepStyle(btn.dataset.prop,+btn.dataset.dir); renderOverlay(); break;
    case 'toggle-a11y': runtime.popover=(runtime.popover==='a11y')?null:'a11y'; renderMasthead(); break;
    case 'a11y-step': stepText(+btn.dataset.dir); break;
    case 'a11y-contrast': toggleContrast(); break;
    case 'a11y-motion': toggleMotion(); break;
    case 'toggle-theme': toggleTheme(); break;
    case 'open-author':
      runtime.pin=''; runtime.pinError=''; runtime.authorSetup=false; runtime.changePin=false;
      runtime.modal={type:'author'}; renderOverlay(); break;
    case 'change-pin':
      if(backend.mode==='api'){ runtime.changePin=true; renderOverlay(); }
      else { runtime.modal={type:'changePin'}; renderOverlay(); }
      break;
    case 'cancel-change-pin': runtime.changePin=false; renderOverlay(); break;
    case 'start-setup':
      runtime.authorSetup=true; runtime.pin=''; runtime.pinError=''; renderOverlay(); break;
    case 'cancel-setup':
      runtime.authorSetup=false; runtime.pinError=''; renderOverlay(); break;
    case 'pin-key': pinPush(btn.dataset.key); break;
    case 'pin-back': pinBack(); break;
    case 'pin-clear': runtime.pin=''; runtime.pinError=''; renderOverlay(); break;
    case 'pin-submit': submitPin(); break;
    case 'signout-everywhere': signOut(true); break;
    case 'rename-site': runtime.modal={type:'rename'}; renderOverlay(); break;
    case 'exit-author': signOut(false); break;
    case 'focus-search':
      setView('library');
      requestAnimationFrame(function(){ var i=document.getElementById('q'); if(i){ i.focus(); i.select(); } });
      break;
  }
}
function onSubmit(e){
  var id=e.target.id;
  if(id==='author-token-form') return submitAuthorToken(e);
  if(id==='author-setup-form') return submitAuthorSetup(e);
  if(id==='poem-editor-form') submitEditor(e);
  else if(id==='comment-form'){ writable?submitComment(e):e.preventDefault(); }
  else if(id==='author-form') submitAuthor(e);
  else if(id==='author-settings-form') submitAuthorSettings(e);
  else if(id==='change-pin-form'){ backend.mode==='api'?submitApiChangePin(e):submitChangePin(e); }
  else if(id==='rename-form') submitRename(e);
}
function onChange(e){ if(e.target.id==='sort'){ runtime.sort=e.target.value; renderIndexList(); } }
var _liveTimer=null;
function autoGrow(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,180)+'px';
}
function onInput(e){
  if(e.target.id==='q'){ runtime.query=e.target.value; renderIndexList(); return; }
  if(e.target.classList && e.target.classList.contains('cf-text')){ autoGrow(e.target); return; }
  if(e.target.id==='ed-body'||e.target.id==='ed-title'){
    clearTimeout(_liveTimer);
    _liveTimer=setTimeout(updateLiveEditor,250);
  }
}
function onKeydown(e){
  var w=e.target&&e.target.closest&&e.target.closest('.wtok');
  if(w&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault();
    var i=+w.dataset.wi;
    setPickerWord(i,runtime.picker.indices.indexOf(i)<0);
    refreshPicker();
    return;
  }
  if(e.key==='Escape'){
    if(runtime.modal) closeModal();
    else if(runtime.popover){ runtime.popover=null; renderMasthead(); }
    return;
  }
  onPinKeydown(e);
}

/* =================================================================
   PUBLIC API  —  window.DadsVerses
   A small scriptable interface over the same data the UI uses.
   Its resource shapes and paths mirror the standalone REST server,
   so code written against one works against the other.
   Run DadsVerses.help() in the browser console for the full list.
   ================================================================= */
var _listeners={};
function emit(evt,detail){
  (_listeners[evt]||[]).forEach(function(fn){ try{ fn(detail); }catch(e){ console.error(e); } });
  (_listeners['*']||[]).forEach(function(fn){ try{ fn({event:evt,detail:detail}); }catch(e){ console.error(e); } });
}
function apiError(code,message,status){ var e=new Error(message); e.code=code; e.status=status||400; return e; }
function requireAuthor(){
  if(!runtime.authorMode) throw apiError('not_author','Author mode is locked. Call DadsVerses.unlock("PIN") first.',401);
}
function publicPoem(p){
  var a=analysisFor(p);
  var words=poemWords(p.body);
  return {
    id:p.id, title:p.title, date:p.date, tags:p.tags.slice(), body:p.body, blurb:p.blurb||'',
    form:a.form.form, structure:a.form.structure,
    highlights:highlightsOf(p).slice(),
    highlightedWords:highlightsOf(p).map(function(i){ return words[i]?words[i].s:null; }).filter(Boolean),
    likes:p.likedBy.length, likedByMe:p.likedBy.indexOf(visitorId)>=0,
    comments:p.comments.map(function(c){ return {id:c.id,name:c.name,text:c.text,createdAt:c.ts}; }),
    style:Object.assign({},p.style), sample:!!p.sample,
    keyWords:a.keys.slice(0,12).map(function(k){ return {word:k.word,count:k.count}; }),
    wordCount:a.wordCount, lineCount:a.lineCount, stanzaCount:a.stanzaCount
  };
}
function commitAPI(evt,detail){ render(); persist(); emit(evt,detail); emit('change',detail); }

function apiSetHighlights(id,value){
  requireAuthor();
  var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
  var idx;
  if(Array.isArray(value)&&value.every(function(v){ return typeof v==='number'; })) idx=value.slice();
  else if(Array.isArray(value)) idx=indicesForWords(p.body,value);
  else if(value&&Array.isArray(value.indices)) idx=value.indices.slice();
  else if(value&&Array.isArray(value.words)) idx=indicesForWords(p.body,value.words);
  else throw apiError('bad_request','Pass an array of word indices, an array of words, or {indices|words}.');
  var max=poemWords(p.body).length;
  idx=idx.filter(function(i){ return Number.isInteger(i)&&i>=0&&i<max; });
  p.highlights=idx.sort(function(a,b){ return a-b; });
  commitAPI('highlights:changed',{id:id,indices:p.highlights});
  return publicPoem(p);
}

var API={
  version:'1.1.0',

  /* --- reading --- */
  getPoems:function(opts){
    opts=opts||{};
    var list=state.poems.slice();
    if(opts.search){
      var q=String(opts.search).toLowerCase();
      list=list.filter(function(p){
        return p.title.toLowerCase().indexOf(q)>=0||p.body.toLowerCase().indexOf(q)>=0||
          p.tags.some(function(t){ return t.toLowerCase().indexOf(q)>=0; })||formOf(p).toLowerCase().indexOf(q)>=0;
      });
    }
    if(opts.form) list=list.filter(function(p){ return formOf(p).toLowerCase()===String(opts.form).toLowerCase(); });
    if(opts.tag) list=list.filter(function(p){ return p.tags.some(function(t){ return t.toLowerCase()===String(opts.tag).toLowerCase(); }); });
    list.sort(function(a,b){ return opts.sort==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date); });
    if(opts.offset) list=list.slice(opts.offset);
    if(opts.limit) list=list.slice(0,opts.limit);
    return list.map(publicPoem);
  },
  getPoem:function(id){ var p=poemById(id); return p?publicPoem(p):null; },
  search:function(q){ return API.getPoems({search:q}); },
  getForms:function(){
    var t={}; state.poems.forEach(function(p){ var f=formOf(p); t[f]=(t[f]||0)+1; });
    return Object.keys(t).map(function(f){ return {form:f,count:t[f],color:formColor(f)}; })
      .sort(function(a,b){ return b.count-a.count; });
  },
  getTags:function(){
    var t={}; state.poems.forEach(function(p){ p.tags.forEach(function(x){ t[x]=(t[x]||0)+1; }); });
    return Object.keys(t).sort().map(function(x){ return {tag:x,count:t[x]}; });
  },
  analyze:function(id){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    var a=analysisFor(p);
    return {
      id:p.id, form:a.form.form, structure:a.form.structure, evidence:a.form.evidence,
      lineCount:a.lineCount, stanzaCount:a.stanzaCount, wordCount:a.wordCount,
      uniqueWords:a.uniqueCount, vocabularyRichness:round2(a.richness),
      rhymeDensity:round2(a.form.rhymeDensity), enjambmentRatio:round2(a.enjambRatio),
      avgWordsPerLine:round2(a.avgWordsPerLine), avgSentenceLength:round2(a.avgSent),
      keyWords:a.keys.slice(0,20).map(function(k){ return {word:k.word,count:k.count}; }),
      imageFields:a.fields.filter(function(f){ return f.count>0; }).map(function(f){ return {field:f.name,count:f.count,examples:f.examples}; }),
      alliteration:a.allit.map(function(x){ return {sound:x.sound,words:x.words,line:x.line}; }),
      repeatedPhrases:a.repeatedPhrases, similes:a.similes,
      rhymeSchemes:a.form.schemes
    };
  },
  getCollection:function(){
    var poems=state.poems.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var vocab={},total=0;
    poems.forEach(function(p){ var a=analysisFor(p); total+=a.wordCount; tokenize(p.body).forEach(function(w){ vocab[w]=1; }); });
    return {
      poems:poems.length, totalWords:total, distinctWords:Object.keys(vocab).length,
      averageWords:poems.length?Math.round(total/poems.length):0,
      forms:API.getForms(), tags:API.getTags(),
      firstPoem:poems.length?poems[0].date:null, latestPoem:poems.length?poems[poems.length-1].date:null
    };
  },

  /* --- highlights --- */
  getHighlights:function(id){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    var words=poemWords(p.body);
    return highlightsOf(p).map(function(i){ return {index:i, word:words[i]?words[i].s:null}; });
  },
  setHighlights:function(id,value){ return apiSetHighlights(id,value); },
  highlightWords:function(id,words){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    return apiSetHighlights(id,indicesForWords(p.body,[].concat(words)));
  },
  addHighlights:function(id,value){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    var extra=Array.isArray(value)&&value.every(function(v){ return typeof v==='number'; })?value:indicesForWords(p.body,[].concat(value));
    var merged=highlightsOf(p).concat(extra).filter(function(v,i,arr){ return arr.indexOf(v)===i; });
    return apiSetHighlights(id,merged);
  },
  clearHighlights:function(id){ return apiSetHighlights(id,[]); },
  suggestHighlights:function(id,n){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    return keyWords(p.body,n||6).map(function(k){ return {word:k.word,count:k.count,indices:indicesForWords(p.body,[k.word])}; });
  },

  /* --- writing (author mode) --- */
  isAuthor:function(){ return !!runtime.authorMode; },
  unlock:function(secret){
    if(backend.mode==='api'){
      /* A PIN opens a session; anything longer is treated as the master token. */
      if(/^\d{4,8}$/.test(String(secret))){
        return apiFetch('/auth/session',{method:'POST',body:{pin:String(secret),device:deviceLabel()}})
          .then(function(out){
            backend.token=out.token; saveToken(out.token);
            backend.authorName=out.name||null; runtime.authorMode=true; render(); return true;
          });
      }
      backend.token=String(secret);
      return apiFetch('/export',{auth:true}).then(function(){
        saveToken(backend.token); runtime.authorMode=true; render(); return true;
      }).catch(function(err){
        backend.token=null;
        throw apiError('bad_token','That is neither a valid PIN nor the author token.',401);
      });
    }
    if(!state.site.pinHash) throw apiError('no_pin','No PIN is set yet — set one from the lock button first.',409);
    if(simpleHash(String(secret))!==state.site.pinHash) throw apiError('bad_pin','That PIN is not right.',401);
    runtime.authorMode=true; render(); return true;
  },
  lock:function(){
    runtime.authorMode=false;
    if(backend.mode==='api'){ backend.token=null; saveToken(null); }
    render(); return true;
  },
  backend:function(){ return {mode:backend.mode, storage:backend.storage, signedIn:!!backend.token}; },
  reload:function(){ return backend.mode==='api' ? loadFromApi().then(function(){ render(); return true; }) : Promise.resolve(false); },
  createPoem:function(input){
    requireAuthor();
    if(!input||!input.title||!input.body) throw apiError('bad_request','title and body are required.');
    var p={ id:genId(), title:String(input.title).trim(), date:input.date||todayISO(),
      tags:Array.isArray(input.tags)?input.tags:[], body:String(input.body),
      blurb:typeof input.blurb==='string'?input.blurb:'',
      style:Object.assign(defaultPoemStyle(),input.style||{}),
      highlights:[], sample:false, likedBy:[], comments:[] };
    state.poems.push(p);
    if(input.highlights) p.highlights=Array.isArray(input.highlights)&&input.highlights.every(function(v){ return typeof v==='number'; })
      ? input.highlights.slice() : indicesForWords(p.body,input.highlights);
    _analysisCache={};
    commitAPI('poem:created',{id:p.id});
    return publicPoem(p);
  },
  updatePoem:function(id,patch){
    requireAuthor();
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    patch=patch||{};
    if(patch.body!=null && patch.body!==p.body){
      p.highlights=remapHighlights(p.body,String(patch.body),highlightsOf(p));
      p.body=String(patch.body);
    }
    if(patch.title!=null) p.title=String(patch.title).trim();
    if(patch.blurb!=null) p.blurb=String(patch.blurb);
    if(patch.date!=null) p.date=patch.date;
    if(Array.isArray(patch.tags)) p.tags=patch.tags.slice();
    if(patch.style) p.style=Object.assign(p.style,patch.style);
    if(patch.highlights) p.highlights=Array.isArray(patch.highlights)&&patch.highlights.every(function(v){ return typeof v==='number'; })
      ? patch.highlights.slice() : indicesForWords(p.body,patch.highlights);
    p.sample=false;
    _analysisCache={};
    commitAPI('poem:updated',{id:p.id});
    return publicPoem(p);
  },
  deletePoem:function(id){
    requireAuthor();
    var before=state.poems.length;
    state.poems=state.poems.filter(function(p){ return p.id!==id; });
    if(state.poems.length===before) throw apiError('not_found','No poem with id '+id,404);
    _analysisCache={};
    commitAPI('poem:deleted',{id:id});
    return true;
  },

  /* --- engagement --- */
  like:function(id){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    if(p.likedBy.indexOf(visitorId)<0) p.likedBy.push(visitorId);
    commitAPI('poem:liked',{id:id,likes:p.likedBy.length});
    return {likes:p.likedBy.length,likedByMe:true};
  },
  unlike:function(id){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    var i=p.likedBy.indexOf(visitorId); if(i>=0) p.likedBy.splice(i,1);
    commitAPI('poem:unliked',{id:id,likes:p.likedBy.length});
    return {likes:p.likedBy.length,likedByMe:false};
  },
  addComment:function(id,name,text){
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    if(!name||!text) throw apiError('bad_request','name and text are required.');
    var c={id:genId(),name:String(name).slice(0,40),text:String(text).slice(0,600),ts:new Date().toISOString()};
    p.comments.push(c);
    commitAPI('comment:added',{id:id,commentId:c.id});
    return {id:c.id,name:c.name,text:c.text,createdAt:c.ts};
  },
  deleteComment:function(id,commentId){
    requireAuthor();
    var p=poemById(id); if(!p) throw apiError('not_found','No poem with id '+id,404);
    p.comments=p.comments.filter(function(c){ return c.id!==commentId; });
    commitAPI('comment:deleted',{id:id,commentId:commentId});
    return true;
  },

  /* --- data --- */
  exportJSON:function(pretty){ return JSON.stringify({site:state.site,poems:state.poems},null,pretty?2:0); },
  importJSON:function(json,opts){
    requireAuthor();
    opts=opts||{};
    var incoming=typeof json==='string'?JSON.parse(json):json;
    if(!incoming||!Array.isArray(incoming.poems)) throw apiError('bad_request','Expected {poems:[...]}.');
    var next=normalizeState(incoming);
    if(opts.merge){
      var have={}; state.poems.forEach(function(p){ have[p.id]=1; });
      next.poems.forEach(function(p){ if(!have[p.id]) state.poems.push(p); });
    } else {
      state.poems=next.poems;
      if(incoming.site) state.site=Object.assign(state.site,{name:next.site.name,byline:next.site.byline});
    }
    _analysisCache={};
    commitAPI('data:imported',{count:next.poems.length});
    return {imported:next.poems.length,total:state.poems.length};
  },

  /* --- events --- */
  on:function(evt,fn){ (_listeners[evt]=_listeners[evt]||[]).push(fn); return function(){ API.off(evt,fn); }; },
  off:function(evt,fn){ _listeners[evt]=(_listeners[evt]||[]).filter(function(f){ return f!==fn; }); },

  /* --- REST-shaped bridge: same paths as the standalone server --- */
  fetch:function(path,init){
    init=init||{};
    var method=(init.method||'GET').toUpperCase();
    var body=init.body?(typeof init.body==='string'?JSON.parse(init.body):init.body):null;
    return new Promise(function(resolve){
      function ok(data,status){ resolve({status:status||200,ok:true,data:data}); }
      function fail(e){ resolve({status:e.status||400,ok:false,data:{error:e.code||'error',message:e.message}}); }
      try{
        var url=String(path).split('?')[0].replace(/\/+$/,'');
        var qs={};
        (String(path).split('?')[1]||'').split('&').forEach(function(kv){
          if(!kv) return; var t=kv.split('='); qs[decodeURIComponent(t[0])]=decodeURIComponent(t[1]||'');
        });
        var seg=url.replace(/^\/?api\/?/,'').split('/').filter(Boolean);
        if(seg[0]==='health') return ok({status:'ok',version:API.version,poems:state.poems.length});
        if(seg[0]==='collection') return ok(API.getCollection());
        if(seg[0]==='forms') return ok(API.getForms());
        if(seg[0]==='tags') return ok(API.getTags());
        if(seg[0]==='export') return ok(JSON.parse(API.exportJSON()));
        if(seg[0]==='import'&&method==='POST') return ok(API.importJSON(body,{merge:qs.merge==='true'}));
        if(seg[0]!=='poems') return fail(apiError('not_found','Unknown path '+path,404));
        if(seg.length===1){
          if(method==='GET') return ok(API.getPoems({search:qs.search,form:qs.form,tag:qs.tag,sort:qs.sort,
            limit:qs.limit?+qs.limit:0,offset:qs.offset?+qs.offset:0}));
          if(method==='POST') return ok(API.createPoem(body),201);
          return fail(apiError('method_not_allowed','GET or POST only',405));
        }
        var id=seg[1];
        if(seg.length===2){
          if(method==='GET'){ var one=API.getPoem(id); return one?ok(one):fail(apiError('not_found','No poem with id '+id,404)); }
          if(method==='PATCH'||method==='PUT') return ok(API.updatePoem(id,body));
          if(method==='DELETE') return ok({deleted:API.deletePoem(id)});
          return fail(apiError('method_not_allowed','GET, PATCH or DELETE',405));
        }
        if(seg[2]==='highlights'){
          if(method==='GET') return ok(API.getHighlights(id));
          if(method==='PUT') return ok(API.setHighlights(id,body));
          if(method==='POST') return ok(API.addHighlights(id,body&&(body.indices||body.words)||body));
          if(method==='DELETE') return ok(API.clearHighlights(id));
        }
        if(seg[2]==='analysis'&&method==='GET') return ok(API.analyze(id));
        if(seg[2]==='suggestions'&&method==='GET') return ok(API.suggestHighlights(id,qs.limit?+qs.limit:6));
        if(seg[2]==='likes'){
          if(method==='POST') return ok(API.like(id));
          if(method==='DELETE') return ok(API.unlike(id));
        }
        if(seg[2]==='comments'){
          if(method==='GET'){ var pp=API.getPoem(id); return pp?ok(pp.comments):fail(apiError('not_found','No poem with id '+id,404)); }
          if(method==='POST') return ok(API.addComment(id,body&&body.name,body&&body.text),201);
          if(method==='DELETE'&&seg[3]) return ok({deleted:API.deleteComment(id,seg[3])});
        }
        return fail(apiError('not_found','Unknown path '+path,404));
      }catch(e){ fail(e); }
    });
  },

  help:function(){
    var lines=[
      'DadsVerses v'+API.version+' — scriptable interface for this site',
      '',
      'READ  getPoems({search,form,tag,sort,limit,offset}) · getPoem(id) · search(q)',
      '      getForms() · getTags() · analyze(id) · getCollection()',
      'HIGHLIGHTS  getHighlights(id) · setHighlights(id, indices|words)',
      '      highlightWords(id, ["light","gold"]) · addHighlights(id, …)',
      '      clearHighlights(id) · suggestHighlights(id, n)',
      'WRITE (author mode)  unlock(pin) · lock() · isAuthor()',
      '      createPoem({title, body, date, tags, style, highlights})',
      '      updatePoem(id, patch) · deletePoem(id)',
      'ENGAGE  like(id) · unlike(id) · addComment(id, name, text) · deleteComment(id, commentId)',
      'DATA  exportJSON(pretty) · importJSON(json, {merge})',
      'EVENTS  on(evt, fn) → unsubscribe · off(evt, fn)',
      '      change · poem:created · poem:updated · poem:deleted',
      '      highlights:changed · poem:liked · comment:added · data:imported',
      'REST BRIDGE  fetch(path, {method, body}) → {status, ok, data}',
      '      Same paths as the standalone server, e.g.',
      '      await DadsVerses.fetch("/api/poems?form=ode")',
      '      await DadsVerses.fetch("/api/poems/ID/highlights", {method:"PUT", body:{words:["hold"]}})'
    ];
    console.log(lines.join('\n'));
    return lines.join('\n');
  }
};
function installAPI(){
  try{
    Object.defineProperty(window,'DadsVerses',{value:API,writable:false,configurable:true});
  }catch(e){ window.DadsVerses=API; }
}

/* ================= BOOT ================= */
function boot(){
  applyPrefs();
  document.addEventListener('click',onClick);
  document.addEventListener('submit',onSubmit);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKeydown);
  document.addEventListener('pointerdown',pickerPointerDown);
  document.addEventListener('pointerover',pickerPointerOver);
  document.addEventListener('pointerup',pickerPointerUp);
  document.addEventListener('pointercancel',pickerPointerUp);
  installAPI();
  applyCachedSite();
  render();
  initBackend().then(function(){
    render();
    if(backend.mode==='preview') showToast('Preview — changes are not saved');
    else if(backend.mode==='api'&&backend.storage&&backend.storage.writable===false)
      showToast('Read-only — connect a KV store to save changes');
  });
}
boot();

/* ============ APP SCRIPT END ============ */
})();
